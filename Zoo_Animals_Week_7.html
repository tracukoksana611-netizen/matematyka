let state;try{state=JSON.parse(localStorage.getItem('zoo-animals-week7-v1'))||{done:[],drawings:{}}}catch{state={done:[],drawings:{}}}state.done=state.done||[];state.drawings=state.drawings||{};
const app=document.getElementById('app');let group,queue=[],at=0,answered=false,ink='#3b7dcc',ctx,canvas,down=false,marks=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('zoo-animals-week7-v1',JSON.stringify(state))}catch{alert('Pamięć jest pełna. Rysunek nie został zapisany. Możesz wydrukować go z pracowni.')}}
function speak(s){if(!('speechSynthesis'in window)){alert('Ta przeglądarka nie obsługuje odczytu. Poproś dorosłego o przeczytanie.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.75;speechSynthesis.speak(u)}
function home(){app.innerHTML=`<div class="hero"><div><div class="tag">WEEK 7 • ANIMALS & A DAY AT THE ZOO</div><h1>Witaj w zoo!<br>Poznaj zwierzęta.</h1><p>Posłuchaj, odkryj i spróbuj. Kilka małych zadań na dzień wystarczy.</p><button class="primary" onclick="theory('animals')">Zaczynamy! →</button></div><div class="hero-art" aria-hidden="true">🦁<br>🦒 🐘 🦜</div></div><h2>Wybierz swoją przygodę</h2><p>Ukończone: <b>${state.done.length} / ${T.length}</b></p><progress value="${state.done.length}" max="${T.length}"></progress><div class="grid">${G.map(g=>`<div class="card"><div class="icon">${g[1]}</div><h3>${g[2]}</h3><p>${g[3]}</p><small>${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length} aktywności</small><div class="tools"><button onclick="theory('${g[0]}')">Poznaj</button><button class="primary" onclick="start('${g[0]}')">Poćwicz →</button></div></div>`).join('')}</div><button onclick="gallery()">📚 Wszystkie 5 kart z PDF</button>`;window.scrollTo(0,0)}
function word(en,pl,icon='',color=''){return `<div class="card word">${color?`<span class="swatch" style="background:${color}"></span>`:`<div class="icon" aria-hidden="true">${icon}</div>`}<div class="en">${en}</div><div>${pl}</div><button aria-label="Posłuchaj: ${en}" onclick="speak(${esc(JSON.stringify(en))})">🔊 Posłuchaj</button></div>`}
function animalCard(a){return `<div class="card word"><img class="animal" src="${A[a[0]]}" alt="${a[1]}"><div class="en">${a[0]}</div><p>${a[1]}</p><button onclick="speak('${a[0]}')">🔊 Posłuchaj</button></div>`}
function theory(g){group=g;let x='';if(['animals','pictures','letters'].includes(g)){x='<p>Posłuchaj kilku nazw. Powtórz, wskaż ilustrację i wróć do pozostałych słów później.</p><div class="grid">'+AN.map(animalCard).join('')+'</div><p class="notice">Nie wszystkie te zwierzęta żyją w dżungli. Żyrafa i zebra kojarzą się z sawanną, koala z Australią, a pies jest zwierzęciem domowym. Poznajemy zwierzęta z kart o zoo.</p>';if(g==='letters')x='<div class="card"><p class="bigword">IOLN → LION</p><p>Litery są pomieszane. Wybierz poprawnie zapisaną nazwę.</p></div>'+x;}
if(g==='search')x='<p>Kliknij pierwszą i ostatnią literę nazwy zwierzęcia. Szukaj poziomo, pionowo i ukośnie. Możesz zaznaczać w obie strony.</p><div class="grid">'+AN.filter(a=>['dog','monkey','giraffe','tiger','lion','zebra','elephant','panda','koala'].includes(a[0])).map(animalCard).join('')+'</div><p>Na liście jest dziewięć słów. Znalezione słowa się zapisują. W oryginalnej siatce są też BEAR (niedźwiedź) i DEER (jeleń) — możesz poszukać ich dodatkowo na wydruku.</p>';
if(g==='zoo')x='<p>Przeczytaj lub posłuchaj instrukcji. Najpierw znajdź przedmiot, potem kolor. W ćwiczeniach wybierasz nazwę koloru; w pracowni kolorujesz całą scenę.</p><img class="scene" src="'+A.zoo+'" alt="Scena w zoo do kolorowania"><div class="grid">'+ZOO.map(([en,pl])=>word(en,pl,'🎨')).join('')+'</div><div class="card"><p class="en">Color the zoo entrance in rainbow colors.</p><p>Pokoloruj wejście do zoo na kolory tęczy.</p><button onclick="speak(\'Color the zoo entrance in rainbow colors.\')">🔊 Posłuchaj</button><p class="en">Color the children’s hair black.</p><p>Pokoloruj włosy dzieci na czarno.</p><button onclick="speak(\'Color the children’s hair black.\')">🔊 Posłuchaj</button><p class="en">Color the tree and the grass green.</p><p>Pokoloruj drzewo i trawę na zielono.</p><button onclick="speak(\'Color the tree and the grass green.\')">🔊 Posłuchaj</button></div><p>Gray i grey oznaczają ten sam kolor: szary.</p>';
if(g==='describe')x='<div class="notice"><b>is = jest</b> • cecha, np. big, long, pink.<br><b>has got = ma</b> • np. neck, tail, stripes.</div><div class="grid">'+D.map(([q,a,pl])=>word(q.replace('___',a),pl,'💬')).join('')+'</div><p><b>neck</b> — szyja • <b>tail</b> — ogon • <b>stripes</b> — paski.</p>';
if(g==='art')x='<p>Trzy oryginalne karty: pisanie i kolorowanie zwierząt, dzień w zoo oraz dokończenie koali na siatce.</p><p>Na koali zobacz mały wzór, a potem dorysuj brakujące linie w dużym rysunku. Rysuj po swojemu — liczy się próba.</p><p class="notice">Do zoo: wejście — tęcza; niska żyrafa — yellow; wysoka — orange; słoń — grey; głowa lwa — yellow, ciało — orange; ptak na zebrze — red; sukienka skaczącej dziewczynki — purple; ubrania chłopca — blue; włosy dzieci — black; drzewo i trawa — green.</p><button onclick="theory(\'zoo\')">Posłuchaj wszystkich instrukcji do zoo</button><p>Program zapisuje rysunek i udział, nie ocenia pisma ani kolorowania.</p>';
if(g==='review')x='<p>Krótki powrót do poprzednich sześciu tygodni.</p><div class="grid">'+[['Hello!','Cześć!','👋'],['I am happy.','Czuję radość.','😊'],['pencil case','piórnik','👝'],['hands','dłonie','🤲'],['twelve','dwanaście','🔢'],['small','mały','🐟'],['Clap your hands.','Klaszcz w dłonie.','👏'],['Mo has got one eye.','Mo ma jedno oko.','👁️'],['She isn’t tall.','Ona nie jest wysoka.','📏'],['There are four books.','Są cztery książki.','📚']].map(w=>word(...w)).join('')+'</div>';
app.innerHTML=`<div class="tag">POZNAJ • POSŁUCHAJ • POWTÓRZ</div><h1>${G.find(x=>x[0]===g)[2]}</h1>${x}<div class="tools"><button onclick="home()">← Mapa</button><button class="primary" onclick="start('${g}')">Teraz zabawa →</button></div>`;window.scrollTo(0,0)}
function start(g){group=g;queue=T.filter(t=>t.g===g&&!state.done.includes(t.id));if(!queue.length)queue=T.filter(t=>t.g===g);at=0;render()}
function render(){answered=false;let t=queue[at];if(!t){app.innerHTML='<div class="task"><div class="icon">⭐</div><h1>Świetna przygoda!</h1><p>Czas na łyk wody i chwilę ruchu.</p><button class="primary" onclick="home()">Wróć na mapę</button></div>';return}app.innerHTML=`<div class="tools"><button onclick="theory('${group}')">📖 Teoria</button><span>Zadanie ${at+1} / ${queue.length}</span></div><progress value="${at}" max="${queue.length}"></progress><div class="task"><h2>${t.q}</h2>${t.draw||t.search?'':`${t.color?`<span class="swatch" style="background:${t.color}"></span>`:''}${t.picture?`<img class="animal" src="${A[t.picture]}" alt="Zwierzę do nazwania">`:''}${t.scene?`<img class="scene" src="${A.zoo}" alt="Dzień w zoo">`:''}${t.translation?`<p>${esc(t.translation)}</p>`:''}${t.icon?`<div class="icon">${t.icon}</div>`:''}${t.display?`<p class="${t.g==='letters'?'bigword':'en'}">${esc(t.display)}</p>`:''}${t.say?'<button onclick="speak(queue[at].say)">🔊 Posłuchaj</button>':''}<div class="options">${[...t.o].sort((a,b)=>hash(t.id+a)-hash(t.id+b)).map(o=>`<button onclick="answer(this.textContent.trim())">${esc(o)}</button>`).join('')}</div>`}<div id="drawing"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 Podpowiedź</button><button id="next" class="primary" onclick="at++;render()" hidden>Dalej →</button></div></div>`;if(t.draw)draw(t);if(t.search)searchView();window.scrollTo(0,0)}
function hash(s){return [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)}
function answer(v){if(answered)return;let t=queue[at],f=document.getElementById('feedback');if(v===t.a){done(t);f.className='feedback good';f.textContent='Tak! Dobra robota. ⭐'}else{f.className='feedback try';f.textContent='Spróbuj jeszcze raz. Możesz użyć podpowiedzi.'}}
function done(t){answered=true;if(!state.done.includes(t.id))state.done.push(t.id);save();document.getElementById('next').hidden=false}
function hint(){let t=queue[at];if(t.search){searchHint();return;}document.getElementById('feedback').textContent=t.draw?'Rysuj spokojnie. Pokaż pracę dorosłemu; liczy się próba.':'Podpowiedź: '+t.a+(t.g==='letters'?' → '+t.display.replace('_',t.a):'');if(t.say)speak(t.say)}
function draw(t){let d=document.getElementById('drawing');d.innerHTML=`<div class="drawbox"><div class="tools palette">${C.map(c=>`<button style="background:${c[2]}" aria-label="Kolor: ${c[1]}" aria-pressed="${ink===c[2]}" onclick="pick('${c[2]}',this)"></button>`).join('')}</div><canvas id="canvas" width="900" height="1273" aria-label="Karta do kolorowania i pisania"></canvas><div class="tools"><label>Grubość <input type="range" min="2" max="25" value="7" id="width"></label><button onclick="redraw()">Od nowa</button><button onclick="printDrawing()">Drukuj rysunek</button><button class="primary" onclick="finishArt()">Gotowe ✓</button></div></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');marks=0;loadDrawing(state.drawings[t.id]||PAGES[t.page-1]);const point=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!down)return;ctx.strokeStyle=ink;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...point(e));ctx.stroke();marks++};canvas.onpointerup=canvas.onpointercancel=()=>{down=false}}
function pick(c,b){ink=c;document.querySelectorAll('.palette button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}
function loadDrawing(src){let im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function redraw(){if(!confirm('Przywrócić czystą kartę?'))return;marks=0;delete state.drawings[queue[at].id];save();loadDrawing(PAGES[queue[at].page-1])}
function finishArt(){let t=queue[at];if(marks<2&&!state.drawings[t.id]){document.getElementById('feedback').textContent='Najpierw narysuj kilka kresek.';return}state.drawings[t.id]=canvas.toDataURL('image/webp',.8);done(t);document.getElementById('feedback').textContent='Praca zapisana. Pokaż ją dorosłemu. 🎨'}
const PT=["Nazwy zwierząt po śladzie", "Wyszukiwanka zwierząt", "Zoo scramble — rozsypanki", "Dzień w zoo — kolorowanie", "Dokończ koalę"];
function gallery(){app.innerHTML='<h1>Twoje karty z PDF</h1><p>Oryginalne ilustracje i karty do oglądania lub wydruku. Poprawione objaśnienia znajdziesz pod kartą.</p><div class="grid">'+PT.map((p,i)=>`<button class="pagebtn" onclick="sheet(${i+1})">${i+1}. ${p} →</button>`).join('')+'</div>'}
function note(p){return p===1?'Nie wszystkie przedstawione zwierzęta żyją w dżungli. W module poznajemy zwierzęta z kart o zoo.':p===2?'Do znalezienia jest 9 nazw z listy. Dodatkowe słowa w siatce: BEAR (niedźwiedź), DEER (jeleń).':p===4?'Wejście tęczowe; niska żyrafa żółta, wysoka pomarańczowa; słoń szary; głowa lwa żółta, ciało pomarańczowe; ptak na zebrze czerwony; sukienka skaczącej dziewczynki fioletowa; ubrania chłopca niebieskie; włosy dzieci czarne; drzewo i trawa zielone.':p===5?'Dorysuj brakujące fragmenty według małego wzoru. To zadanie plastyczne bez automatycznej oceny.':'Oryginalna karta z PDF. W module wybierzesz poprawną nazwę, a na wydruku możesz ją zapisać i połączyć ze zwierzęciem.'}
function sheet(p){app.innerHTML=`<button onclick="gallery()">← Karty</button><h2>${p}. ${PT[p-1]}</h2><p class="notice">${note(p)}</p><img class="sheet" src="${PAGES[p-1]}" alt="Oryginalna karta ${p}: ${PT[p-1]}"><button onclick="printPage(${p})">Drukuj tę kartę</button>`;window.scrollTo(0,0)}
function printWin(content){let w=window.open('','_blank');if(!w){alert('Zezwól na otwarcie nowej karty, aby drukować.');return}w.document.write('<!doctype html><html lang="pl"><meta charset="utf-8"><title>Zoo Adventure Club — druk</title><style>body{font:20px Arial;margin:25px}img{max-width:100%;max-height:90vh;object-fit:contain}article{break-after:page}button{font:20px Arial;padding:15px}@media print{button{display:none}img{max-height:250mm}}</style><button onclick="window.print()">Drukuj</button>'+content+'</html>');w.document.close()}
function printPage(p){printWin(`<p>${note(p)}</p><img src="${PAGES[p-1]}">`)}function printDrawing(){printWin('<img src="'+canvas.toDataURL()+'">')}
function printTheory(){printWin('<h1>Zoo Adventure Club • słowniczek</h1>'+AN.map(a=>'<p><b>'+a[0]+'</b> — '+a[1]+'</p>').join('')+'<h2>Instrukcje do zoo</h2>'+ZOO.map(([en,pl])=>'<p><b>'+en+'</b><br>'+pl+'</p>').join('')+'<p>Wejście — tęcza; włosy dzieci — black; drzewo i trawa — green.</p><h2>Opis</h2><p>is = jest • has got = ma</p>')}
function adult(){app.innerHTML=`<h1>Dla dorosłych</h1><div class="card"><p>${T.length} aktywności w 8 rozdziałach. Wbudowano wszystkie 5 stron PDF. Teoria, polecenia i tłumaczenia po polsku, słowa i odczyt po angielsku. Powtórka obejmuje tygodnie 1–6.</p><p>Słownik obejmuje 14 nazw: siedem z pierwszej karty, zwierzęta z wyszukiwanki i rozsypanek. Wszystkie poza psem pochodzą z ilustracji nowego PDF; pies jest z wcześniejszego materiału. Wyszukiwanka ma oryginalną siatkę 9×9 i sprawdza dziewięć słów z listy. BEAR i DEER są dodatkowymi słowami do odkrycia na wydruku.</p><p>Rozsypanki wybieramy spośród poprawnie zapisanych słów. W kolorowaniu najpierw wskazujemy kolor do instrukcji, potem malujemy całą scenę. Wszystkie instrukcje z PDF są przetłumaczone i mają odczyt w teorii. Koala jest zadaniem rysunkowym na oryginalnej siatce. Program nie ocenia pisma ani rysunku.</p><p>Wyjaśniono, że nie wszystkie zwierzęta z kart żyją w dżungli. Gray i grey oznaczają szary. W gramatyce powtarzamy „is” (jest) i „has got” (ma). Nie wymaga się opanowania wszystkich słów naraz — wybierzcie kilka, potem przerwę.</p><p>Odczyt zależy od głosu angielskiego urządzenia. Nie ma nagrywania ani oceny wymowy. Postępy, znalezione słowa i rysunki pozostają w tej przeglądarce. Przy pełnej pamięci wydrukuj rysunek.</p><h2>Postępy</h2>${G.map(g=>`<p>${g[1]} ${g[2]}: ${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length}</p>`).join('')}<div class="tools"><button onclick="printTheory()">Drukuj słowniczek</button><button onclick="printWin(document.querySelector('.card').innerHTML)">Drukuj postępy</button><button onclick="clearAll()">Wyczyść postępy</button></div></div>`;window.scrollTo(0,0)}
function clearAll(){if(confirm('Usunąć postępy i zapisane rysunki tego modułu?')){state={done:[],drawings:{}};save();home()}}
const GRID=['ELEPHANTP','SGMEKOALA','LIONNCLAN','BRNFUDHND','EAKORWOTA','AFEMUIAGE','RFYCHERDY','ZEBRADEER','PINTIGERW'];
const TARGETS=['DOG','MONKEY','GIRAFFE','TIGER','LION','ZEBRA','ELEPHANT','PANDA','KOALA'];let firstCell=null;
function line(a,b){let r0=Math.floor(a/9),c0=a%9,r1=Math.floor(b/9),c1=b%9,dr=r1-r0,dc=c1-c0;if(dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc))return [];let n=Math.max(Math.abs(dr),Math.abs(dc));return Array.from({length:n+1},(_,i)=>(r0+Math.sign(dr)*i)*9+c0+Math.sign(dc)*i)}
function findWord(w){for(let a=0;a<81;a++)for(let b=0;b<81;b++){let p=line(a,b);if(p.map(i=>GRID[Math.floor(i/9)][i%9]).join('')===w)return p}return []}
function searchView(){state.found=state.found||[];firstCell=null;let foundCells=new Set(state.found.flatMap(findWord));document.getElementById('drawing').innerHTML=`<p>Kliknij pierwszą i ostatnią literę słowa.</p><p>${TARGETS.slice(0,9).map(w=>`<span class="wordtag ${state.found.includes(w)?'found':''}">${w}</span>`).join('')}</p><div class="wordgrid">${GRID.join('').split('').map((c,i)=>`<button class="${foundCells.has(i)?'found':''}" aria-label="Wiersz ${Math.floor(i/9)+1}, kolumna ${i%9+1}: ${c}" data-cell="${i}" onclick="chooseCell(${i})">${c}</button>`).join('')}</div><p>Znalezione: ${state.found.length} / 9</p>`;if(state.found.length===9){done(queue[at]);document.getElementById('feedback').textContent='Wszystkie zwierzęta znalezione! ⭐'}}
function chooseCell(i){if(answered)return;if(firstCell===null){firstCell=i;document.querySelector(`[data-cell="${i}"]`).classList.add('selected');return}let cells=line(firstCell,i),w=cells.map(j=>GRID[Math.floor(j/9)][j%9]).join('');let reverse=[...w].reverse().join('');let target=TARGETS.includes(w)?w:TARGETS.includes(reverse)?reverse:null;if(target){if(!state.found.includes(target))state.found.push(target);save();searchView();document.getElementById('feedback').textContent=target==='GOLD'?'GOLD — złoty! To sekretny kolor.':'Znalezione: '+target+'!';speak(target.toLowerCase());if(state.found.length===9)document.getElementById('feedback').textContent='Wszystkie zwierzęta znalezione! ⭐'}else{document.querySelectorAll('.selected').forEach(b=>b.classList.remove('selected'));firstCell=null;document.getElementById('feedback').textContent='To jeszcze nie całe słowo. Wybierz pierwszą i ostatnią literę nazwy zwierzęcia.'}}
function searchHint(){let w=TARGETS.find(w=>!state.found?.includes(w));if(!w)return;let p=findWord(w),a=p[0],b=p[p.length-1];document.getElementById('feedback').textContent=`Szukaj ${w}: od wiersza ${Math.floor(a/9)+1}, kolumny ${a%9+1} do wiersza ${Math.floor(b/9)+1}, kolumny ${b%9+1}.`;speak(w.toLowerCase())}

home();
</script></html>
