<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emotion Island</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8f7ff;background-image:radial-gradient(#bdddfc 2px,transparent 2px);background-size:25px 25px;font-family:"Trebuchet MS",sans-serif;color:#28346a}main{max-width:1050px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;font-weight:900}h1{font-size:clamp(35px,7vw,68px);margin:8px 0}button{cursor:pointer;font:inherit;font-weight:900}.hero{background:linear-gradient(125deg,#6a62ed,#e879c6);color:white;border-radius:35px;padding:35px;margin:25px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 0 #c7c5ef}.hero p{font-size:20px}.hero .emoji{font-size:clamp(85px,18vw,190px);animation:bob 3s infinite}@keyframes bob{50%{transform:translateY(-15px)}}.btn{background:#ffcf54;color:#473b60;border:0;border-radius:20px;padding:15px 22px;box-shadow:0 6px 0 #d6a842;font-size:18px}.btn:active,.option:active{transform:translateY(4px);box-shadow:none}.secondary{background:#fff;box-shadow:0 5px 0 #d5d8ef}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.tile{background:linear-gradient(135deg,#ffe9a8,#ffc3c3);border:4px solid white;border-radius:25px;padding:22px;text-align:left;box-shadow:0 7px 0 #cdd7ef;min-height:170px;color:#28346a}.tile:nth-child(even){background:linear-gradient(135deg,#c9e6ff,#d9bbff)}.tile:nth-child(3n){background:linear-gradient(135deg,#bdf5df,#a4e0ff)}.tile b{display:block;font-size:22px}.tile .emoji{font-size:55px;display:block}.panel{background:white;border-radius:30px;padding:clamp(20px,5vw,40px);margin:24px 0;box-shadow:0 10px 0 #cbd7ef}.bar{height:14px;background:#e7e9ff;border-radius:20px;margin:20px 0;overflow:hidden}.fill{height:100%;background:#f879ac;transition:width .2s}.question{font-size:clamp(25px,4vw,40px);font-weight:900}.hint{font-size:18px;color:#65739c}.visual{text-align:center;font-size:clamp(95px,17vw,170px);margin:20px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin:20px 0}.option{border:3px solid #dfe3fc;border-radius:20px;background:#f0f2ff;padding:18px;font-size:clamp(19px,3vw,26px);color:#343d86;box-shadow:0 5px 0 #cdd3f5}.option:hover{background:#fff0bd}.good{background:#b7f1d1}.bad{background:#ffd3dc}.hidden{display:none!important}.feedback{font-size:21px;font-weight:900;min-height:35px}.tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.letter{border:0;border-radius:14px;padding:15px 20px;background:#ffdfa3;font-size:25px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:490px;margin:20px auto}.memory button{aspect-ratio:1;border:3px solid #aaa8ff;border-radius:16px;background:#7066dd;color:white;font-size:clamp(25px,5vw,55px)}.memory button.open{background:#f4f2ff;color:#2b3972}.facebox{margin:auto;width:220px;height:220px;border-radius:43%;border:7px solid #477b73;background:#a7e991;text-align:center;padding-top:35px;font-size:70px;box-shadow:inset -15px -15px 0 #0001}.swatches{display:flex;justify-content:center;gap:10px;margin:20px}.swatches button{width:45px;height:45px;border:4px solid white;border-radius:50%}@media(max-width:550px){.hero{padding:20px}.hero .emoji{font-size:80px}.options{grid-template-columns:1fr 1fr}.option{padding:13px}.tile{min-height:140px}}</style>
<main><header><div>🏝️ <strong>EMOTION ISLAND</strong> <small>EN / PL</small></div><div id="stats">⭐ 0 | 🏆 0/7</div></header><section id="home"><div class="hero"><div><small>🎮 ENGLISH ADVENTURE</small><h1>Wyspa Emocji!</h1><p>7 poziomów, minigry, gwiazdki i finałowy boss!</p><button class="btn" onclick="start(0)">▶ ZAGRAJ!</button></div><div class="emoji">😎</div></div><h2>🗺️ Mapa przygody</h2><div class="map" id="map"></div><p>🔊 Angielska wymowa korzysta z głosów przeglądarki. Gra działa bez internetu.</p></section><section id="game" class="hidden"><div class="panel"><div class="tools"><button class="btn secondary" onclick="home()">← MAPA</button><strong id="level"></strong><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="task"></div><div id="feedback" class="feedback"></div><div class="tools"><button class="btn secondary" onclick="say(current)">🔊 POSŁUCHAJ</button><button id="next" class="btn hidden" onclick="next()">DALEJ ➜</button></div></div></section></main><script>
const levels=[["😊","Happy or Sad?","Rozpoznaj emocje"],["🕵️","Emotion Detective","Znajdź właściwą minę"],["🎧","Guess & Point","Słuchaj i wskazuj"],["🏃","Sit & Stand!","Ruchowe komendy"],["🔤","Word Builder","Układaj słowa"],["🎨","Funny Face Lab","Stwórz postać"],["🏆","Final Boss","Gra pamięciowa i finał"]];
const words=[["happy","😄"],["sad","😢"],["angry","😠"],["surprised","😲"],["in love","😍"],["sleepy","😴"],["cold","🥶"],["hot","🥵"],["thirsty","🥤"]];
let done=JSON.parse(localStorage.getItem("ei_done")||"[]"),stars=+(localStorage.getItem("ei_stars")||0),lvl=0,idx=0,qs=[],answered=false,current="",assembled="",cards=[],open=[],found=[],locked=false,face=0;
const el=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);
function stats(){el("stats").textContent=`⭐ ${stars} | 🏆 ${done.length}/7`;localStorage.setItem("ei_done",JSON.stringify(done));localStorage.setItem("ei_stars",stars)}
function home(){el("home").classList.remove("hidden");el("game").classList.add("hidden");el("map").innerHTML=levels.map((x,i)=>`<button class="tile" onclick="start(${i})"><span class="emoji">${x[0]}</span><b>${i+1}. ${x[1]}</b><small>${x[2]} ${done.includes(i)?"✅":""}</small></button>`).join("");stats();scrollTo(0,0)}
function say(t){current=t;if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.78;speechSynthesis.speak(u)}
function start(n){lvl=n;idx=0;el("home").classList.add("hidden");el("game").classList.remove("hidden");el("level").textContent=levels[n][0]+" "+levels[n][1];qs=n===0?shuffle(words.slice(0,5)):n===1?shuffle(words).slice(0,6):n===2?shuffle(words).slice(0,6):n===3?shuffle(["happy","sad","happy","sad","happy","sad"]).map(x=>[x,""]):n===4?shuffle(["happy","sad","angry","sleepy","nose","mouth","eyes","hands"]).slice(0,6).map(x=>[x,({nose:"👃",mouth:"👄",eyes:"👀",hands:"🙌"}[x]||words.find(y=>y[0]===x)?.[1])]):n===5?[["builder",""]]:[["memory",""],...shuffle(words.slice(0,5)).slice(0,3)];render();scrollTo(0,0)}
function choice(a,correct){return `<div class="options">${shuffle(a).map(x=>`<button class="option" onclick="check(this,${JSON.stringify(x===correct)})">${x}</button>`).join("")}</div>`}
function render(){answered=false;assembled="";el("feedback").textContent="";el("next").classList.add("hidden");el("count").textContent=`${idx+1}/${qs.length}`;el("fill").style.width=(idx/qs.length*100)+"%";let q=qs[idx],w=q[0],v=q[1],h="";
if(lvl===0||lvl===6&&idx>0){current=w;h=`<div class="question">Jak czuje się ta buźka?</div><div class="hint">Wybierz angielskie słowo.</div><div class="visual">${v}</div>`+choice([w,...shuffle(words.filter(x=>x[0]!==w)).slice(0,3).map(x=>x[0])],w)}
if(lvl===1){current=w;h=`<div class="question">🔎 Znajdź: ${w.toUpperCase()}</div><div class="hint">Kliknij właściwą buźkę.</div><div class="visual">🕵️</div>`+choice([v,...shuffle(words.filter(x=>x[0]!==w)).slice(0,3).map(x=>x[1])],v)}
if(lvl===2){current=w;h=`<div class="question">🎧 Słuchaj i wskaż!</div><div class="hint">Naciśnij głośnik i wybierz buźkę.</div><div class="visual"><button class="btn" onclick="say(current)">🔊 PLAY</button></div>`+choice([v,...shuffle(words.filter(x=>x[0]!==w)).slice(0,3).map(x=>x[1])],v);setTimeout(()=>say(w),250)}
if(lvl===3){current="I'm "+w;let correct=w==="happy"?"🙌 Wstań i uśmiechnij się":"🪑 Usiądź i zrób smutną minę";h=`<div class="question">🏃 Sit & Stand!</div><div class="hint">Wykonaj ruch, a potem wybierz odpowiedź.</div><div class="visual"><button class="btn" onclick="say(current)">🔊 I'M ${w.toUpperCase()}!</button></div>`+choice(["🙌 Wstań i uśmiechnij się","🪑 Usiądź i zrób smutną minę"],correct)}
if(lvl===4){current=w;h=`<div class="question">🔤 Zbuduj słowo!</div><div class="hint">Klikaj litery w dobrej kolejności.</div><div class="visual">${v}</div><div class="question" style="text-align:center" id="assembled">_ _ _</div><div class="letters">${shuffle(w.split("")).map(c=>`<button class="letter" onclick="pick(this,'${c}')">${c.toUpperCase()}</button>`).join("")}</div><p style="text-align:center"><button class="btn secondary" onclick="render()">↺ OD NOWA</button></p>`}
if(lvl===5){current="My monster is happy";h=`<div class="question">🎨 Funny Face Lab</div><p class="hint">Zmień kolor i emocję, a potem powiedz zdanie.</p><div class="facebox" id="facebox"><div>👀</div><div id="mood">😄</div></div><div class="swatches">${["#a7e991","#ffb5d4","#ffd579","#9acfff","#d5bbff"].map(c=>`<button style="background:${c}" onclick="el('facebox').style.background='${c}'"></button>`).join("")}</div><div style="text-align:center"><button class="btn secondary" onclick="face=(face+1)%4;el('mood').textContent=['😄','😢','😠','😲'][face];current='My monster is '+['happy','sad','angry','surprised'][face];el('desc').textContent=current;say(current)">ZMIEŃ EMOCJĘ</button><h2 id="desc">My monster is happy</h2><button class="btn" onclick="win()">⭐ GOTOWE!</button></div>`}
if(lvl===6&&idx===0){current="Find matching pairs";cards=shuffle(["😄","😢","😠","😲","😄","😢","😠","😲"]);open=[];found=[];locked=false;h=`<div class="question">🏆 Memory Boss!</div><div class="hint">Znajdź wszystkie pary.</div><div class="memory">${cards.map((_,i)=>`<button id="card${i}" onclick="flip(${i})">?</button>`).join("")}</div>`}
el("task").innerHTML=h}
function check(b,yes){if(answered)return;if(yes){b.classList.add("good");win()}else{b.classList.add("bad");el("feedback").textContent="Spróbuj jeszcze raz! 💪";say("Try again")}}
function win(){if(answered)return;answered=true;stars+=10;stats();el("feedback").textContent="🎉 ŚWIETNIE! +10 ⭐";el("next").classList.remove("hidden");say("Great job!")}
function pick(b,c){if(answered)return;b.disabled=true;b.style.opacity=.25;assembled+=c;el("assembled").textContent=assembled.toUpperCase();if(assembled.length===qs[idx][0].length){if(assembled===qs[idx][0])win();else el("feedback").textContent="Spróbuj ponownie! ↺"}}
function flip(i){if(answered||locked||open.includes(i)||found.includes(i))return;let b=el("card"+i);b.textContent=cards[i];b.classList.add("open");open.push(i);if(open.length===2){let[a,c]=open;if(cards[a]===cards[c]){found.push(a,c);open=[];if(found.length===8)win()}else{locked=true;setTimeout(()=>{for(let j of [a,c]){el("card"+j).textContent="?";el("card"+j).classList.remove("open")}open=[];locked=false},800)}}}
function next(){if(!answered)return;idx++;if(idx===qs.length){if(!done.includes(lvl))done.push(lvl);stats();el("fill").style.width="100%";el("task").innerHTML=`<div class="visual">🏆</div><h1 style="text-align:center">POZIOM UKOŃCZONY!</h1><p style="text-align:center">Brawo! Zdobywasz odznakę!</p><div style="text-align:center"><button class="btn" onclick="home()">🗺️ MAPA</button> <button class="btn secondary" onclick="start(${(lvl+1)%7})">DALEJ ➜</button></div>`;el("feedback").textContent="";el("next").classList.add("hidden");say("You are a champion!")}else render()}
home();
</script></html>
