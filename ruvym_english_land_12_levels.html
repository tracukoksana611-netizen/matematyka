<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рувим у English Land</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#233451}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#a4e8ff,#e7d8ff 55%,#fff2bd);min-height:100vh}.app{max-width:920px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ffffffdd;border-radius:24px;padding:14px 20px;box-shadow:0 8px 30px #5375a42b}h1{font-size:clamp(22px,4vw,34px);margin:0}.tag{font-weight:800;color:#7753ba}.stars{background:#ffedaa;padding:10px 15px;border-radius:30px;font-weight:900}.scene{margin-top:18px;background:#ffffffed;border:5px solid #fff;border-radius:32px;box-shadow:0 15px 45px #5864a33a;padding:clamp(16px,4vw,32px);text-align:center;min-height:500px}.hero{font-size:75px;filter:drop-shadow(0 7px 2px #0002);animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-8px)}}h2{font-size:clamp(24px,4vw,36px);margin:8px 0}p{line-height:1.5}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:22px 0}.level{min-height:132px;border:3px solid #fff;border-radius:23px;background:linear-gradient(#f5fdff,#dcf1ff);font-weight:800;color:#27375a;padding:12px;cursor:pointer;box-shadow:0 5px 0 #b7d5e9}.level.locked{opacity:.55;filter:grayscale(.7)}.level .em{font-size:36px;display:block}.level .num{font-size:12px;color:#6a65a0}button{font:inherit;cursor:pointer;border:0}.primary,.secondary{padding:13px 22px;border-radius:17px;font-weight:850;font-size:18px;margin:6px}.primary{background:#6556d8;color:white;box-shadow:0 5px 0 #4236a4}.secondary{background:#e8edff;color:#393c79}.primary:active,.secondary:active,.choice:active{transform:translateY(3px)}.prompt{background:#fff4c6;border:2px dashed #efca58;border-radius:22px;padding:14px;margin:14px auto;max-width:590px;font-size:22px;font-weight:850}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px;margin:20px auto;max-width:700px}.choice{min-height:116px;border:3px solid #e5e4ff;border-radius:22px;background:white;font-size:20px;font-weight:800;box-shadow:0 6px 0 #d8d7ef;color:#24365a;touch-action:manipulation}.choice .emoji{font-size:47px;display:block}.choice.good{background:#d2ffda;border-color:#44bb73}.choice.bad{background:#ffe0e0;border-color:#ff8383}.feedback{font-size:22px;font-weight:850;min-height:32px}.progress{height:13px;background:#e5e6f7;border-radius:20px;overflow:hidden;max-width:570px;margin:12px auto}.progress div{height:100%;background:linear-gradient(90deg,#65dba7,#48a6e9);transition:width .3s}.footer{font-size:13px;color:#54617a;text-align:center;margin:18px}.hidden{display:none}.target{min-height:120px;border:3px dashed #8d80df;border-radius:24px;background:#f5f0ff;padding:15px;margin:12px auto;max-width:350px;font-size:58px}.float{animation:bob 1.8s infinite}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:520px;margin:18px auto}.memory button{aspect-ratio:1;background:#a2d6fa;border-radius:17px;font-size:clamp(17px,4vw,35px);font-weight:800;color:#293b64}.memory button.open{background:#fff5d5}.memory button.done{background:#c5f5d2}.note{font-size:14px;color:#62718b}.success{font-size:58px} .actions{display:flex;justify-content:center;flex-wrap:wrap} @media(max-width:500px){.scene{min-height:450px}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{min-height:105px}.top{padding:10px}.stars{padding:7px}}
</style></head><body><div class="app"><header class="top"><div><div class="tag">🌈 ENGLISH LAND</div><h1>Пригоди Рувима</h1></div><div class="stars" id="stars">⭐ 0</div></header><main class="scene" id="scene"></main><div class="footer">Англійські слова • польські підказки • грай у власному темпі</div></div>
<script>
const colors=[["red","czerwony","🔴"],["blue","niebieski","🔵"],["yellow","żółty","🟡"],["green","zielony","🟢"],["pink","różowy","🩷"],["orange","pomarańczowy","🟠"],["purple","fioletowy","🟣"],["black","czarny","⚫"],["white","biały","⚪"],["brown","brązowy","🟤"],["grey","szary","🩶"]];
const things=[["pencil","ołówek","✏️"],["pen","długopis","🖊️"],["book","książka","📚"],["backpack","plecak","🎒"],["ruler","linijka","📏"],["scissors","nożyczki","✂️"],["eraser","gumka","🧽"],["notebook","zeszyt","📓"],["glue","klej","🧴"],["crayons","kredki","🖍️"],["paper","papier","📄"],["pencil case","piórnik","👝"],["paint","farby","🎨"],["sharpener","temperówka","✏️"],["paper clip","spinacz","🖇️"],["stapler","zszywacz","📎"],["desk","biurko","🪑"]];
const levels=[
["🎈","Кулькова галявина","balloons",colors.slice(0,5)],
["🎒","Збери рюкзак","bag",things.slice(0,5)],
["👾","Голодний монстрик","monster",colors.slice(3,9)],
["🧩","Знайди пару","memory",colors.slice(0,4)],
["🌳","Чарівний ліс","find",things.slice(3,9)],
["🚂","Веселий потяг","train",colors.slice(5,11)],
["🪄","Чарівна паличка","listen",things.slice(6,12)],
["🏰","Замок кольорів","find",colors.slice(0,7)],
["🧠","Суперпам'ять","memory",things.slice(0,4)],
["🐉","Допоможи дракончику","monster",things.slice(9,15)],
["🌟","Зоряна доріжка","listen",colors.slice(0,8)],
["💎","Великий скарб","treasure",things.slice(10,17)]
];
const store="ruvym-english-adventure-v2";let saved={};try{saved=JSON.parse(localStorage.getItem(store)||"{}")}catch(e){}
let unlocked=Math.max(0,Math.min(11,saved.unlocked||0)),stars=saved.stars||0,done=saved.done||{},level=0,step=0,correct=0,items=[],answered=false,memOpen=[],memDone=[],memBusy=false;
const $=id=>document.getElementById(id),scene=$("scene");function persist(){try{localStorage.setItem(store,JSON.stringify({unlocked,stars,done}))}catch(e){}$("stars").textContent="⭐ "+stars}
function say(word){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang="en-GB";u.rate=.75;u.pitch=1.12;window.speechSynthesis.speak(u)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function home(){persist();scene.innerHTML=`<div class="hero">🧒🏻🎒</div><h2>Привіт! Я Рувим!</h2><p>Подорожуй разом зі мною, слухай слова, грай та відкривай нові світи!</p><div class="map">${levels.map((l,i)=>`<button class="level ${i>unlocked?'locked':''}" onclick="openLevel(${i})"><span class="num">РІВЕНЬ ${i+1} ${done[i]?'⭐':i>unlocked?'🔒':''}</span><span class="em">${l[0]}</span>${l[1]}</button>`).join("")}</div><button class="secondary" onclick="if(confirm('Скинути весь прогрес?')){unlocked=0;stars=0;done={};home()}">🔄 Почати пригоду заново</button>`}
function openLevel(i){if(i>unlocked)return;level=i;step=0;correct=0;answered=false;let data=levels[i][3];items=shuffle(data).slice(0,levels[i][2]==="memory"?4:5);if(levels[i][2]==="memory")memoryStart();else renderRound()}
function progress(){return `<div class="progress"><div style="width:${step/items.length*100}%"></div></div><p class="note">Завдання ${Math.min(step+1,items.length)} з ${items.length}</p>`}
function renderRound(){if(step>=items.length){finish();return}answered=false;const L=levels[level],item=items[step],type=L[2];let pool=L[3].filter(x=>x[0]!==item[0]);let opts=shuffle([item,...shuffle(pool).slice(0,3)]);let instruction=type==="balloons"?"Лопни правильну кульку!":type==="bag"?"Поклади потрібну річ у рюкзак!":type==="monster"?"Нагодуй друга правильною картинкою!":type==="train"?"Знайди правильний вагончик!":type==="listen"?"Послухай і вибери предмет!":type==="treasure"?"Знайди ключ до скарбу!":"Знайди правильну картинку!";
let deco=type==="bag"?"🎒":type==="monster"?"👾":type==="train"?"🚂":type==="treasure"?"🗝️":type==="balloons"?"🎈":"🪄";
scene.innerHTML=`<div class="hero">${L[0]}</div><h2>${L[1]}</h2>${progress()}<p>${instruction}</p><div class="prompt">${type==="listen"?"🔊 Яке слово ти почув?":`Знайди: ${esc(item[0])}`} <button class="secondary" onclick="say('${item[0]}')">🔊 Слухати</button></div><div class="target">${deco}</div><div class="choices">${opts.map(x=>`<button class="choice ${type==="balloons"?"float":""}" data-word="${esc(x[0])}" onclick="choose(this)"><span class="emoji">${x[2]}</span>${type==="listen"?"":esc(x[1])}</button>`).join("")}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" onclick="home()">🗺️ Карта</button><button class="secondary" onclick="say('${item[0]}')">🔊 Повторити</button><button class="primary hidden" id="next" onclick="nextRound()">Далі ➜</button></div>`;
if(type==="listen")say(item[0])}
function choose(btn){if(answered)return;const item=items[step],ok=btn.dataset.word===item[0];if(ok){answered=true;correct++;stars++;btn.classList.add("good");$("feedback").textContent="🎉 Чудово! "+item[0]+" — "+item[1];$("next").classList.remove("hidden");say(item[0]);persist()}else{btn.classList.add("bad");$("feedback").textContent="💛 Спробуй ще раз!";say(item[0]);setTimeout(()=>btn.classList.remove("bad"),650)}}
function nextRound(){step++;renderRound()}
function memoryStart(){let pairs=items.flatMap((x,i)=>[{id:i,label:x[2],word:x[0]},{id:i,label:x[1],word:x[0]}]);items=shuffle(pairs);memOpen=[];memDone=[];memBusy=false;memoryRender()}
function memoryRender(){let L=levels[level];scene.innerHTML=`<div class="hero">🧠</div><h2>${L[1]}</h2><p>Відкрий дві картки та знайди пару: картинка + польське слово.</p><div class="progress"><div style="width:${memDone.length/4*100}%"></div></div><div class="memory">${items.map((x,i)=>`<button class="${memOpen.includes(i)?'open':''} ${memDone.includes(x.id)?'done':''}" onclick="flip(${i})">${memOpen.includes(i)||memDone.includes(x.id)?x.label:"❔"}</button>`).join("")}</div><p id="feedback" class="feedback"></p><button class="secondary" onclick="home()">🗺️ Карта</button>`}
function flip(i){let x=items[i];if(memBusy||memOpen.includes(i)||memDone.includes(x.id))return;memOpen.push(i);memoryRender();if(memOpen.length===2){let [a,b]=memOpen;if(items[a].id===items[b].id){memDone.push(items[a].id);stars++;say(items[a].word);persist();memOpen=[];setTimeout(()=>{if(memDone.length===4)finish();else memoryRender()},550)}else{memBusy=true;setTimeout(()=>{memOpen=[];memBusy=false;memoryRender()},900)}}}
function finish(){done[level]=true;unlocked=Math.max(unlocked,Math.min(level+1,11));stars+=2;persist();scene.innerHTML=`<div class="success">🏆✨🎉</div><h2>Ура! Рівень пройдено!</h2><p>Рувим пишається тобою! Ти відкрив нову пригоду.</p><div class="prompt">⭐ +2 бонусні зірочки!</div><div class="actions"><button class="secondary" onclick="openLevel(${level})">🔁 Ще раз</button><button class="secondary" onclick="home()">🗺️ Карта</button>${level<11?`<button class="primary" onclick="openLevel(${level+1})">Наступний рівень ➜</button>`:`<button class="primary" onclick="home()">🎊 Усі пригоди пройдено!</button>`}</div>`}
persist();home();
</script></body></html>
