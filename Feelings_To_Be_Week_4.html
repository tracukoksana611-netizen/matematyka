if(g==='sentences'||g==='meaning')x='<p>Spójrz na początek zdania. Dopasuj am, is lub are.</p><div class="grid">'+GR.map(([q,a,pl])=>word(q.replace('___',a),pl,'💬')).join('')+'</div><p class="notice">Na oryginalnej karcie jest „You ___ are my friend”. Poprawna wersja to <b>You are my friend.</b> W module jest tylko jedno miejsce na „are”. Zdanie o klasie czwartej uproszczono do „I am at school”.</p>';
if(g==='checkin')x='<div class="card"><div class="icon">🌤️</div><h2>Today I feel…</h2><p>Dzisiaj czuję się…</p><button onclick="speak(\'How do you feel today?\')">🔊 How do you feel today?</button><p>Możesz wybrać słowo, powiedzieć coś własnego lub pominąć odpowiedź. Każdy wybór jest przyjmowany. Nie musisz czuć się jak postać na obrazku.</p></div>';
if(g==='art')x='<p>Wybierz kolor i dorysuj oczy, brwi oraz usta. Możesz pokazać emocję po swojemu.</p><p class="notice">Karty 1 i 2: wybierz dowolny nastrój. Karta 4: napisy pod twarzami są propozycją do rysowania, nie testem rozpoznawania czyichś uczuć. Dorosły może pomóc przeczytać podpisy.</p><div class="grid">'+F.filter(f=>['happy','angry','sad','confused','scared','tired'].includes(f[0])).map(f=>word(f[0],f[2],f[3])).join('')+'</div><p>Na kartach „to be” pisz po śladzie. Program zapisuje próbę, nie ocenia pisma ani mimiki.</p>';
if(g==='review')x='<p>To już znamy z poprzednich tygodni.</p><div class="grid">'+[['Hello!','Cześć!','👋'],['Nice to meet you.','Miło cię poznać.','🤝'],['blue','niebieski','🔵'],['school bag','plecak','🎒'],['eyes','oczy','👀'],['nose','nos','👃'],['feet','stopy','🦶'],['My monster has got two eyes.','Mój potwór ma dwoje oczu.','👾']].map(w=>word(...w)).join('')+'</div>';
app.innerHTML=`<div class="tag">POZNAJ • POSŁUCHAJ • POWTÓRZ</div><h1>${G.find(x=>x[0]===g)[2]}</h1>${x}<div class="tools"><button onclick="home()">← Mapa</button><button class="primary" onclick="start('${g}')">Teraz zabawa →</button></div>`;window.scrollTo(0,0)}
function checkinView(){document.getElementById('drawing').innerHTML='<p>Wybierz to, co pasuje do ciebie teraz.</p><div class="options">'+F.map(f=>`<button onclick="mood('${f[0]}')">${f[3]} ${f[0]}</button>`).join('')+'</div><button onclick="mood(\'other\')">Inaczej / wolę nie mówić</button>';}
function mood(k){state.mood=k;done(queue[at]);let f=F.find(f=>f[0]===k);document.getElementById('feedback').textContent=f?'Dziękuję za odpowiedź. '+f[2]:'W porządku. Możesz wrócić do tego później.';if(f)speak(f[1])}
function start(g){group=g;queue=T.filter(t=>t.g===g&&!state.done.includes(t.id));if(!queue.length)queue=T.filter(t=>t.g===g);at=0;render()}
function render(){answered=false;let t=queue[at];if(!t){app.innerHTML='<div class="task"><div class="icon">⭐</div><h1>Świetna przygoda!</h1><p>Czas na łyk wody i chwilę ruchu.</p><button class="primary" onclick="home()">Wróć na mapę</button></div>';return}app.innerHTML=`<div class="tools"><button onclick="theory('${group}')">📖 Teoria</button><span>Zadanie ${at+1} / ${queue.length}</span></div><progress value="${at}" max="${queue.length}"></progress><div class="task"><h2>${t.q}</h2>${t.draw||t.checkin?'':`${t.color?`<span class="swatch" style="background:${t.color}"></span>`:''}${t.picture?`<img class="part" src="${A[t.picture]}" alt="Przykładowa ilustracja uczucia">`:''}${t.icon?`<div class="icon">${t.icon}</div>`:''}${t.display?`<p class="${t.g==='letters'?'bigword':'en'}">${esc(t.display)}</p>`:''}${t.say?'<button onclick="speak(queue[at].say)">🔊 Posłuchaj</button>':''}<div class="options">${[...t.o].sort((a,b)=>hash(t.id+a)-hash(t.id+b)).map(o=>`<button onclick="answer(this.textContent.trim())">${esc(o)}</button>`).join('')}</div>`}<div id="drawing"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 Podpowiedź</button><button id="next" class="primary" onclick="at++;render()" hidden>Dalej →</button></div></div>`;if(t.draw)draw(t);if(t.checkin)checkinView();window.scrollTo(0,0)}
function hash(s){return [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)}
function answer(v){if(answered)return;let t=queue[at],f=document.getElementById('feedback');if(v===t.a){done(t);f.className='feedback good';f.textContent='Tak! Dobra robota. ⭐'}else{f.className='feedback try';f.textContent='Spróbuj jeszcze raz. Możesz użyć podpowiedzi.'}}
function done(t){answered=true;if(!state.done.includes(t.id))state.done.push(t.id);save();document.getElementById('next').hidden=false}
function hint(){let t=queue[at];if(t.checkin){document.getElementById('feedback').textContent='Każdy wybór jest przyjmowany. Możesz też wybrać „wolę nie mówić”.';return;}document.getElementById('feedback').textContent=t.draw?'Rysuj spokojnie. Pokaż pracę dorosłemu; liczy się próba.':'Podpowiedź: '+t.a+(t.g==='letters'?' → '+t.display.replace('_',t.a):'');if(t.say)speak(t.say)}
function draw(t){let d=document.getElementById('drawing');d.innerHTML=`<div class="drawbox"><div class="tools palette">${C.map(c=>`<button style="background:${c[2]}" aria-label="Kolor: ${c[1]}" aria-pressed="${ink===c[2]}" onclick="pick('${c[2]}',this)"></button>`).join('')}</div><canvas id="canvas" width="900" height="1273" aria-label="Karta do kolorowania i pisania"></canvas><div class="tools"><label>Grubość <input type="range" min="2" max="25" value="7" id="width"></label><button onclick="redraw()">Od nowa</button><button onclick="printDrawing()">Drukuj rysunek</button><button class="primary" onclick="finishArt()">Gotowe ✓</button></div></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');marks=0;loadDrawing(state.drawings[t.id]||PAGES[t.page-1]);const point=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!down)return;ctx.strokeStyle=ink;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...point(e));ctx.stroke();marks++};canvas.onpointerup=canvas.onpointercancel=()=>{down=false}}
function pick(c,b){ink=c;document.querySelectorAll('.palette button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}
function loadDrawing(src){let im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function redraw(){if(!confirm('Przywrócić czystą kartę?'))return;marks=0;delete state.drawings[queue[at].id];save();loadDrawing(PAGES[queue[at].page-1])}
function finishArt(){let t=queue[at];if(marks<2&&!state.drawings[t.id]){document.getElementById('feedback').textContent='Najpierw narysuj kilka kresek.';return}state.drawings[t.id]=canvas.toDataURL('image/webp',.8);done(t);document.getElementById('feedback').textContent='Praca zapisana. Pokaż ją dorosłemu. 🎨'}
const PT=["Mój nastrój — rysunek 1", "Mój nastrój — rysunek 2", "Ilustracje uczuć", "Dorysuj mimikę", "To be — zdania", "Pisz po śladzie 1", "Pisz po śladzie 2"];
function gallery(){app.innerHTML='<h1>Twoje karty z PDF</h1><p>Oryginalne ilustracje i karty do oglądania lub wydruku. Poprawione objaśnienia znajdziesz pod kartą.</p><div class="grid">'+PT.map((p,i)=>`<button class="pagebtn" onclick="sheet(${i+1})">${i+1}. ${p} →</button>`).join('')+'</div>'}
function note(p){return p===1||p===2?'Gdy chodzi o samopoczucie, zamiast „I am bad” mówimy „I feel bad”. Możesz narysować dowolny nastrój i nie musisz o nim opowiadać.':p===3||p===4?'Ilustracje pokazują przykładową mimikę. Ludzie mogą wyrażać podobne uczucia na różne sposoby.':p===5?'Poprawka w zadaniu 5: You are my friend. Wstawiamy „are” tylko raz. W module zdanie o klasie czwartej zastąpiono „I am at school”.':'Oryginalna karta do pisania po śladzie. Pracuj spokojnie; program nie ocenia pisma.'}
function sheet(p){app.innerHTML=`<button onclick="gallery()">← Karty</button><h2>${p}. ${PT[p-1]}</h2><p class="notice">${note(p)}</p><img class="sheet" src="${PAGES[p-1]}" alt="Oryginalna karta ${p}: ${PT[p-1]}"><button onclick="printPage(${p})">Drukuj tę kartę</button>`;window.scrollTo(0,0)}
function printWin(content){let w=window.open('','_blank');if(!w){alert('Zezwól na otwarcie nowej karty, aby drukować.');return}w.document.write('<!doctype html><html lang="pl"><meta charset="utf-8"><title>Feelings Club — druk</title><style>body{font:20px Arial;margin:25px}img{max-width:100%;max-height:90vh;object-fit:contain}article{break-after:page}button{font:20px Arial;padding:15px}@media print{button{display:none}img{max-height:250mm}}</style><button onclick="window.print()">Drukuj</button>'+content+'</html>');w.document.close()}
function printPage(p){printWin(`<p>${note(p)}</p><img src="${PAGES[p-1]}">`)}function printDrawing(){printWin('<img src="'+canvas.toDataURL()+'">')}
function printTheory(){printWin('<h1>Feelings Club • słowniczek</h1>'+F.map(f=>'<p><b>'+f[1]+'</b> — '+f[2]+'</p>').join('')+'<h2>To be — być</h2>'+PR.map(([p,a,pl])=>'<p><b>'+p+' '+a+'</b> — '+pl+'</p>').join('')+'<p>I → am • he/she/it → is • you/we/they → are</p>')}
function adult(){app.innerHTML=`<h1>Dla dorosłych</h1><div class="card"><p>${T.length} aktywności w 8 rozdziałach. Wszystkie 7 stron PDF wbudowano do modułu. Teoria i polecenia są po polsku, słowa i odczyt po angielsku. Powtórka obejmuje tygodnie 1–3.</p><p>Poprawiono źródłowe „You ___ are my friend” na „You ___ my friend”. „I am in Primary 4” zastąpiono prostszym „I am at school”, odpowiednim do tego modułu. Gdy mowa o samopoczuciu, używamy „I feel bad”, aby nie utrwalać etykiety „jestem zły”.</p><p>Rysunki uczuć są przykładami; nie diagnozujemy emocji z mimiki. W zadaniach z ilustracjami pytanie podaje polskie znaczenie, a dziecko wybiera angielskie słowo. Własny nastrój nie ma odpowiedzi błędnej; można pominąć odpowiedź. Wszystkie wybory zaliczają udział. Głód i zmęczenie to również stany ciała.</p><p>Zacznijcie od happy, sad, angry i tired. Resztę poznawajcie stopniowo. Nie wymagamy ujawniania samopoczucia. Pismo i mimika nie są oceniane automatycznie. Nie ma nagrywania ani sprawdzania wymowy. Odczyt zależy od głosu urządzenia.</p><p>Postępy, rysunki i ostatni wybór nastroju pozostają w pamięci tej przeglądarki. Można je usunąć przyciskiem poniżej. Przy problemach z pamięcią wydrukuj rysunek. Oryginalne karty zachowują wygląd źródła; poprawki podano obok nich i w ćwiczeniach.</p><h2>Postępy</h2>${G.map(g=>`<p>${g[1]} ${g[2]}: ${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length}</p>`).join('')}<div class="tools"><button onclick="printTheory()">Drukuj słowniczek</button><button onclick="printWin(document.querySelector('.card').innerHTML)">Drukuj postępy</button><button onclick="clearAll()">Wyczyść postępy</button></div></div>`;window.scrollTo(0,0)}
function clearAll(){if(confirm('Usunąć postępy i zapisane rysunki tego modułu?')){state={done:[],drawings:{}};save();home()}}home();
</script></html>
