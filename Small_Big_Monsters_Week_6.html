let state;try{state=JSON.parse(localStorage.getItem('small-big-monsters-week6-v1'))||{done:[],drawings:{}}}catch{state={done:[],drawings:{}}}state.done=state.done||[];state.drawings=state.drawings||{};
const app=document.getElementById('app');let group,queue=[],at=0,answered=false,ink='#3b7dcc',ctx,canvas,down=false,marks=0;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem('small-big-monsters-week6-v1',JSON.stringify(state))}catch{alert('Pamięć jest pełna. Rysunek nie został zapisany. Możesz wydrukować go z pracowni.')}}

function home(){app.innerHTML=`<div class="hero"><div><div class="tag">WEEK 6 • SMALL & BIG • IS & HAS GOT</div><h1>Małe kroki,<br>duże odkrycia.</h1><p>Posłuchaj, odkryj i spróbuj. Kilka małych zadań na dzień wystarczy.</p><button class="primary" onclick="theory('words')">Zaczynamy! →</button></div><div class="hero-art" aria-hidden="true">🐟<br>📏 👏 🎨</div></div><h2>Wybierz swoją przygodę</h2><p>Ukończone: <b>${state.done.length} / ${T.length}</b></p><progress value="${state.done.length}" max="${T.length}"></progress><div class="grid">${G.map(g=>`<div class="card"><div class="icon">${g[1]}</div><h3>${g[2]}</h3><p>${g[3]}</p><small>${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length} aktywności</small><div class="tools"><button onclick="theory('${g[0]}')">Poznaj</button><button class="primary" onclick="start('${g[0]}')">Poćwicz →</button></div></div>`).join('')}</div><button onclick="gallery()">📚 Wszystkie 6 kart z PDF</button>`;window.scrollTo(0,0)}
function word(en,pl,icon='',color=''){return `<div class="card word">${color?`<span class="swatch" style="background:${color}"></span>`:`<div class="icon" aria-hidden="true">${icon}</div>`}<div class="en">${en}</div><div>${pl}</div><button aria-label="Posłuchaj: ${en}" onclick="speak(${esc(JSON.stringify(en))})">🔊 Posłuchaj</button></div>`}
function theory(g){group=g;let x='';if(g==='words')x='<p>Porównaj dwa przedmioty obok siebie. Pokaż coś małego, dużego, długiego i krótkiego.</p><div class="grid">'+V.map(v=>word(...v)).join('')+'</div><p>„Tall” opisuje wysokość, „long” — długość. Przedmiot jest mały lub duży w porównaniu z innym.</p>';
if(g==='sort')x='<p>Klikaj obrazki kolejno: od najmniejszego do największego. Potem naciśnij „Sprawdź kolejność”. Możesz cofnąć ostatni wybór.</p><div class="card"><p class="en">small → big</p><p>mały → duży</p><div class="tools">'+[1,3,5].map(n=>`<img src="${A.ghost1}" alt="Przykładowy rozmiar ${n}" style="width:${50+n*20}px">`).join('')+'</div></div><p>W module są dwie układanki z oryginalnych kart: duszki i kociołki. Nie trzeba nic wycinać.</p>';
if(g==='fish')x='<h2>Small fish • Big fish</h2><p>Małe ryby • Duże ryby. Nie patrz na kolor — w każdej grupie są ryby zielone i żółte.</p><img class="scene" src="'+A.fish+'" alt="Małe i duże ryby do policzenia"><p>Wskazuj każdą rybę tylko raz. Podpowiedź ponumeruje wybraną grupę.</p><div class="card"><p class="en">more small fish</p><p>więcej małych ryb</p><p class="en">more big fish</p><p>więcej dużych ryb</p><p>„Fish” ma tu taką samą formę dla jednej ryby i wielu ryb: one fish, two fish.</p></div>';
if(g==='mo'||g==='molly'){let arr=g==='mo'?MO:MOLLY;x=`<img class="character" src="${A[g]}" alt="Postać ${g==='mo'?'Mo':'Molly'} z PDF"><div class="notice">${g==='mo'?'<b>is = jest</b> • opis cechy lub samopoczucia.<br><b>has got = ma</b> • np. części ciała.':"<b>is not = isn’t = nie jest</b><br><b>has not got = hasn’t got = nie ma</b>"}</div><div class="grid">`+arr.map(([q,a,pl])=>word(q.replace('___',a),pl,'💬')).join('')+'</div>';if(g==='molly')x+='<p>„She hasn’t got long arms” nie znaczy, że nie ma rąk. Ma ręce, ale nie długie. Zadania podają polskie znaczenie zdania, aby wybierać formę językową.</p>'}
if(g==='commands'||g==='move')x='<p>Posłuchaj i powtórz. Możesz wykonać ruch, wskazać obrazek albo powiedzieć polecenie. Zadbaj o miejsce wokół siebie.</p><div class="grid">'+CMD.map(([en,pl,k])=>`<div class="card word"><img class="part" src="${A[k]}" alt="${pl}"><div class="en">${en}</div><p>${pl}</p><button onclick="speak(${esc(JSON.stringify(en))})">🔊 Posłuchaj</button></div>`).join('')+'</div><p class="notice">Dopasuj ruch do siebie. Przy „Touch the ground” możesz wskazać podłogę. Program nie korzysta z kamery i nie ocenia ruchu.</p>';
if(g==='art')x='<p>Pokoloruj Mo, narysuj własną postać w ramce albo narysuj dwie ryby różnej wielkości.</p><div class="grid">'+[['My monster is round.','Mój potwór jest okrągły.','🟠'],['My monster has got two eyes.','Mój potwór ma dwoje oczu.','👀'],['It has got short arms.','Ma krótkie ręce.','💪'],['This fish is small.','Ta ryba jest mała.','🐟']].map(w=>word(...w)).join('')+'</div><p>Wybierz zdanie pasujące do twojego rysunku. Pismo i rysunek nie są oceniane automatycznie.</p>';
if(g==='review')x='<p>Powtórka pięciu poprzednich tygodni.</p><div class="grid">'+[['Hello!','Cześć!','👋'],['I am six.','Mam sześć lat.','6️⃣'],['I am tired.','Czuję zmęczenie.','😴'],['green','zielony','🟢'],['pencil case','piórnik','👝'],['teeth','zęby','🦷'],['hands','dłonie','🤲'],['I am happy.','Czuję radość.','😊'],['twelve','dwanaście','🔢'],['There are four books.','Są cztery książki.','📚']].map(w=>word(...w)).join('')+'</div>';
app.innerHTML=`<div class="tag">POZNAJ • POSŁUCHAJ • POWTÓRZ</div><h1>${G.find(x=>x[0]===g)[2]}</h1>${x}<div class="tools"><button onclick="home()">← Mapa</button><button class="primary" onclick="start('${g}')">Teraz zabawa →</button></div>`;window.scrollTo(0,0)}
let chosen=[];
function sortView(){let t=queue[at];document.getElementById('drawing').innerHTML='<p>Klikaj od najmniejszego do największego.</p><div class="sortgrid">'+[4,1,5,2,3].map(n=>`<button ${chosen.includes(n)?'disabled':''} onclick="chooseSize(${n})"><div class="sizebox"><img src="${A[t.sort+n]}" alt="Karta ${n}" style="width:${45+n*23}px"></div><span>${chosen.includes(n)?'Miejsce '+(chosen.indexOf(n)+1):'Wybierz'}</span></button>`).join('')+'</div><p>Wybrano '+chosen.length+' z 5.</p><div class="tools"><button onclick="chosen.pop();sortView()">Cofnij</button><button onclick="chosen=[];sortView()">Od początku</button><button class="primary" onclick="checkSort()">Sprawdź kolejność</button></div>';}
function chooseSize(n){if(!answered&&!chosen.includes(n)){chosen.push(n);sortView()}}
function checkSort(){if(chosen.length<5){document.getElementById('feedback').textContent='Wybierz wszystkie pięć obrazków.';return}if(chosen.every((n,i)=>n===i+1)){done(queue[at]);document.getElementById('feedback').textContent='Tak! Od najmniejszego do największego. ⭐'}else document.getElementById('feedback').textContent='Spójrz jeszcze raz na wielkości. Cofnij wybór lub zacznij od początku.'}
function movement(){document.getElementById('drawing').innerHTML='<p>Możesz poruszyć się albo pokazać obrazek.</p><div class="tools"><button class="primary" onclick="finishMove()">Spróbowałem / pokazałem ✓</button><button onclick="finishMove()">Dziś pomijam</button></div>'}
function finishMove(){done(queue[at]);document.getElementById('feedback').textContent='Dziękuję. Ćwicz w swoim tempie.'}
function start(g){group=g;queue=T.filter(t=>t.g===g&&!state.done.includes(t.id));if(!queue.length)queue=T.filter(t=>t.g===g);at=0;render()}
function render(){answered=false;chosen=[];let t=queue[at];if(!t){app.innerHTML='<div class="task"><div class="icon">⭐</div><h1>Świetna przygoda!</h1><p>Czas na łyk wody i chwilę ruchu.</p><button class="primary" onclick="home()">Wróć na mapę</button></div>';return}app.innerHTML=`<div class="tools"><button onclick="theory('${group}')">📖 Teoria</button><span>Zadanie ${at+1} / ${queue.length}</span></div><progress value="${at}" max="${queue.length}"></progress><div class="task"><h2>${t.q}</h2>${t.draw||t.sort?'':`${t.color?`<span class="swatch" style="background:${t.color}"></span>`:''}${t.picture?`<img class="part" src="${A[t.picture]}" alt="Ilustracja do ćwiczenia">`:''}${t.fish?`<img class="scene" id="fishscene" src="${A.fish}" alt="Małe i duże ryby do policzenia">`:''}${t.translation?`<p>${esc(t.translation)}</p>`:''}${t.icon?`<div class="icon">${t.icon}</div>`:''}${t.display?`<p class="${t.g==='letters'?'bigword':'en'}">${esc(t.display)}</p>`:''}${t.say?'<button onclick="speak(queue[at].say)">🔊 Posłuchaj</button>':''}<div class="options">${[...t.o].sort((a,b)=>hash(t.id+a)-hash(t.id+b)).map(o=>`<button onclick="answer(this.textContent.trim())">${esc(o)}</button>`).join('')}</div>`}<div id="drawing"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 Podpowiedź</button><button id="next" class="primary" onclick="at++;render()" hidden>Dalej →</button></div></div>`;if(t.draw)draw(t);if(t.sort)sortView();if(t.move)movement();window.scrollTo(0,0)}
function hash(s){return [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)}
function answer(v){if(answered)return;let t=queue[at],f=document.getElementById('feedback');if(v===t.a){done(t);f.className='feedback good';f.textContent='Tak! Dobra robota. ⭐'}else{f.className='feedback try';f.textContent='Spróbuj jeszcze raz. Możesz użyć podpowiedzi.'}}
function done(t){answered=true;if(!state.done.includes(t.id))state.done.push(t.id);save();document.getElementById('next').hidden=false}
function hint(){let t=queue[at];if(t.sort){document.getElementById('feedback').textContent='Szukaj najmniejszego wolnego obrazka. Od lewej na początku: czwarty, drugi, piąty, pierwszy, trzeci.';return;}if(t.move){document.getElementById('feedback').textContent=t.translation+' Możesz wskazać obrazek.';return;}if(t.fish){document.getElementById('fishscene').src=A['fishhint'+t.fish];document.getElementById('feedback').textContent=t.a==='small fish'?'Małych ryb jest 9, dużych 8. Więcej jest małych.':'Jest ich '+t.a+'. Sprawdź numerki.';return;}document.getElementById('feedback').textContent=t.draw?'Rysuj spokojnie. Pokaż pracę dorosłemu; liczy się próba.':'Podpowiedź: '+t.a+(t.g==='letters'?' → '+t.display.replace('_',t.a):'');if(t.say)speak(t.say)}
function draw(t){let d=document.getElementById('drawing');d.innerHTML=`<div class="drawbox"><div class="tools palette">${C.map(c=>`<button style="background:${c[2]}" aria-label="Kolor: ${c[1]}" aria-pressed="${ink===c[2]}" onclick="pick('${c[2]}',this)"></button>`).join('')}</div><canvas id="canvas" width="900" height="1273" aria-label="Karta do kolorowania i pisania"></canvas><div class="tools"><label>Grubość <input type="range" min="2" max="25" value="7" id="width"></label><button onclick="redraw()">Od nowa</button><button onclick="printDrawing()">Drukuj rysunek</button><button class="primary" onclick="finishArt()">Gotowe ✓</button></div></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');marks=0;loadDrawing(state.drawings[t.id]||(t.page?PAGES[t.page-1]:A.blank));const point=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!down)return;ctx.strokeStyle=ink;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...point(e));ctx.stroke();marks++};canvas.onpointerup=canvas.onpointercancel=()=>{down=false}}
function pick(c,b){ink=c;document.querySelectorAll('.palette button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}
function loadDrawing(src){let im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function redraw(){if(!confirm('Przywrócić czystą kartę?'))return;marks=0;delete state.drawings[queue[at].id];save();loadDrawing(queue[at].page?PAGES[queue[at].page-1]:A.blank)}
function finishArt(){let t=queue[at];if(marks<2&&!state.drawings[t.id]){document.getElementById('feedback').textContent='Najpierw narysuj kilka kresek.';return}state.drawings[t.id]=canvas.toDataURL('image/webp',.8);done(t);document.getElementById('feedback').textContent='Praca zapisana. Pokaż ją dorosłemu. 🎨'}
const PT=["Od małego do dużego — duszki", "Od małego do dużego — kociołki", "Małe i duże ryby", "Mo: is / has got", "Molly: isn’t / hasn’t got", "Komendy w klasie"];
function gallery(){app.innerHTML='<h1>Twoje karty z PDF</h1><p>Oryginalne ilustracje i karty do oglądania lub wydruku. Poprawione objaśnienia znajdziesz pod kartą.</p><div class="grid">'+PT.map((p,i)=>`<button class="pagebtn" onclick="sheet(${i+1})">${i+1}. ${p} →</button>`).join('')+'</div>'}
function note(p){return p===3?'Małe ryby: 9. Duże ryby: 8. Razem: 17. Małych jest o jedną więcej. Liczymy wielkości, nie kolory.':p===4?'is = jest, has got = ma. W przeczeniu: is not = isn’t, has not got = hasn’t got.':p===5?'isn’t = nie jest, hasn’t got = nie ma. „Nie ma długich rąk” nie oznacza „nie ma rąk”. Odczyt rysunku nosa może być niejednoznaczny; w ćwiczeniu podano polskie znaczenie zdania.':p===6?'Ruchy można dostosować lub tylko pokazać na ilustracji. Nie trzeba wykonywać ich na stojąco.':'Oryginalna karta z PDF. W module ułożysz obrazki klikaniem, bez wycinania.'}
function sheet(p){app.innerHTML=`<button onclick="gallery()">← Karty</button><h2>${p}. ${PT[p-1]}</h2><p class="notice">${note(p)}</p><img class="sheet" src="${PAGES[p-1]}" alt="Oryginalna karta ${p}: ${PT[p-1]}"><button onclick="printPage(${p})">Drukuj tę kartę</button>`;window.scrollTo(0,0)}
function printWin(content){let w=window.open('','_blank');if(!w){alert('Zezwól na otwarcie nowej karty, aby drukować.');return}w.document.write('<!doctype html><html lang="pl"><meta charset="utf-8"><title>Small & Big Club — druk</title><style>body{font:20px Arial;margin:25px}img{max-width:100%;max-height:90vh;object-fit:contain}article{break-after:page}button{font:20px Arial;padding:15px}@media print{button{display:none}img{max-height:250mm}}</style><button onclick="window.print()">Drukuj</button>'+content+'</html>');w.document.close()}
function printPage(p){printWin(`<p>${note(p)}</p><img src="${PAGES[p-1]}">`)}function printDrawing(){printWin('<img src="'+canvas.toDataURL()+'">')}
function printTheory(){printWin('<h1>Small & Big Club</h1>'+V.map(v=>'<p>'+v[0]+' — '+v[1]+'</p>').join('')+'<h2>Komendy</h2>'+CMD.map(c=>'<p>'+c[0]+' — '+c[1]+'</p>').join('')+'<h2>Jest i ma</h2><p>is = jest • has got = ma • isn’t = nie jest • hasn’t got = nie ma</p><p>Mo is round. • Mo has got one eye.</p><h2>Klucz: ryby</h2><p>9 małych + 8 dużych = 17 ryb. Więcej jest małych.</p>')}
function adult(){app.innerHTML=`<h1>Dla dorosłych</h1><div class="card"><p>${T.length} aktywności w 9 rozdziałach z trzech PDF. Wbudowano wszystkie 6 stron: porządkowanie wielkości, liczenie ryb, Mo i Molly, własna postać oraz komendy. Powtórka obejmuje tygodnie 1–5.</p><p>Sortowanie używa oryginalnych wyciętych ilustracji i zachowuje ich kolejność wielkości. Wybieramy od najmniejszego do największego, sprawdzamy i możemy cofać. W oceanie jest 9 małych i 8 dużych ryb (17 razem); podpowiedzi oznaczają każdą rybę numerkiem.</p><p>Gramatyka rozróżnia „is” i „has got”, a następnie „isn’t” i „hasn’t got”. W zdaniach o Molly podajemy polskie znaczenie, aby zadanie badało wybór formy językowej. Szczegóły rysunku (np. małe kropki na twarzy) nie służą do rozstrzygania odpowiedzi o nosie.</p><p>Ruchanka jest dobrowolna i nie jest oceniana. Dziecko może wykonać ruch, wskazać obrazek lub pominąć zadanie; zapisujemy udział. Nie ma kamery ani nagrywania. Odczyt zależy od głosu urządzenia. Pismo i kolorowanie nie są oceniane automatycznie.</p><p>Wybierz kilka zadań naraz. Rysunki oraz postępy pozostają w tej przeglądarce. Przy braku miejsca wydrukuj rysunek.</p><h2>Postępy</h2>${G.map(g=>`<p>${g[1]} ${g[2]}: ${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length}</p>`).join('')}<div class="tools"><button onclick="printTheory()">Drukuj słowniczek i klucz</button><button onclick="printWin(document.querySelector('.card').innerHTML)">Drukuj postępy</button><button onclick="clearAll()">Wyczyść postępy</button></div></div>`;window.scrollTo(0,0)}
function clearAll(){if(confirm('Usunąć postępy i zapisane rysunki tego modułu?')){state={done:[],drawings:{}};save();home()}}home();
