function home(){app.innerHTML=`<div class="hero"><div><div class="tag">WEEK 3 • FACE, BODY & SCHOOL</div><h1>Moja twarz,<br>moje odkrycia.</h1><p>Posłuchaj, odkryj i spróbuj. Kilka małych zadań na dzień wystarczy.</p><button class="primary" onclick="theory('face')">Zaczynamy! →</button></div><div class="hero-art" aria-hidden="true">🙂<br>🖐️ 🏫 🎨</div></div><h2>Wybierz swoją przygodę</h2><p>Ukończone: <b>${state.done.length} / ${T.length}</b></p><progress value="${state.done.length}" max="${T.length}"></progress><div class="grid">${G.map(g=>`<div class="card"><div class="icon">${g[1]}</div><h3>${g[2]}</h3><p>${g[3]}</p><small>${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length} aktywności</small><div class="tools"><button onclick="theory('${g[0]}')">Poznaj</button><button class="primary" onclick="start('${g[0]}')">Poćwicz →</button></div></div>`).join('')}</div><button onclick="gallery()">📚 Wszystkie 15 kart z PDF</button>`;window.scrollTo(0,0)}
function word(en,pl,icon='',color=''){return `<div class="card word">${color?`<span class="swatch" style="background:${color}"></span>`:`<div class="icon" aria-hidden="true">${icon}</div>`}<div class="en">${en}</div><div>${pl}</div><button aria-label="Posłuchaj: ${en}" onclick="speak(${esc(JSON.stringify(en))})">🔊 Posłuchaj</button></div>`}
function theory(g){group=g;let x='';if(['face','body','school'].includes(g)){let ws=g==='face'?FACE:g==='body'?BODY:W;x='<p>Posłuchaj kilku słów. Wskaż część ciała na sobie lub znajdź rzecz w pokoju. Możesz wskazywać bez dotykania twarzy.</p><div class="grid">'+ws.map(w=>word(...w)).join('')+'</div>';if(g==='face')x='<div class="card">'+faceSVG()+'</div>'+x;if(g==='body')x='<p class="notice"><b>one foot → two feet</b> • jedna stopa → dwie stopy. Forma „feets” w PDF jest błędna.<br><b>hand</b> = dłoń, <b>arm</b> = cała kończyna od barku do nadgarstka.<br><b>one tooth → teeth</b> • ząb → zęby.</p>'+x;if(g==='school')x+='<p>school bag = backpack; rubber = eraser. Obejrzyj też oryginalne ilustracje na kartach 1 i 2.</p>';}
if(g==='pictures')x='<p>Przyjrzyj się ilustracjom z PDF. W ćwiczeniu obrazek nie będzie miał podpisu.</p><div class="grid">'+['eyes','ear','nose','mouth','teeth'].map(w=>`<div class="card word"><img class="part" src="${A[w]}" alt="${w}"><div class="en">${w}</div><button onclick="speak('${w}')">🔊 Posłuchaj</button></div>`).join('')+'</div><p><b>one ear → two ears</b> • jedno ucho → dwoje uszu. <b>one eye → two eyes</b> • jedno oko → dwoje oczu.</p>';
if(g==='letters')x='<p>Litery są pomieszane. Zobacz kolor i wybierz poprawnie zapisane słowo.</p><div class="card"><p class="bigword">e b l u → blue</p><p>blue — niebieski</p><button onclick="speak(\'blue\')">🔊 Posłuchaj</button></div><div class="grid">'+C.slice(0,11).map(c=>word(c[0],c[1],'',c[2])).join('')+'</div><p class="notice">Na karcie 10 słowo „white” ma szarą plamkę. W ćwiczeniu pokazujemy poprawnie biały kolor.</p>';
if(g==='patterns')x='<p>Odkryj parę, która się powtarza. Potem wybierz brakujące słowo.</p><div class="card"><p class="en">nose → hair → nose → hair</p><p>nos → włosy → nos → włosy</p><p class="en">mouth → eyes → mouth → eyes</p><p>usta → oczy → usta → oczy</p><p class="en">teeth → ears → teeth → ears</p><p>zęby → uszy → zęby → uszy</p></div><button onclick="sheet(14)">Zobacz oryginalną tabelę</button>';
if(g==='search')x='<p>Kliknij pierwszą, a potem ostatnią literę słowa. Litery muszą leżeć w jednej linii: poziomo, pionowo lub ukośnie. Możesz szukać w obie strony.</p><p class="notice">Znajdź 12 podanych kolorów i jeden sekretny. <b>Gray = grey</b> (szary). W tej oryginalnej siatce jest forma <b>GRAY</b>.</p><div class="grid">'+C.filter(c=>['silver','gold'].includes(c[0])).map(c=>word(c[0],c[1],'',c[2])).join('')+'</div><p>Możesz wracać do zadania — znalezione słowa się zapisują.</p>';
if(g==='describe')x='<p><b>has got</b> oznacza tutaj „ma”. <b>I have got</b> oznacza „mam”. Opisujemy to, co widzimy.</p><div class="grid">'+[['My monster has got one nose.','Mój potwór ma jeden nos.','👃'],['My monster has got two eyes.','Mój potwór ma dwoje oczu.','👀'],['My monster has got big ears.','Mój potwór ma duże uszy.','👂'],['My monster has got green hair.','Mój potwór ma zielone włosy.','🧑‍🦱'],['I have got two hands.','Mam dwie dłonie.','🤲'],['I have got two feet.','Mam dwie stopy.','🦶']].map(w=>word(...w)).join('')+'</div><p class="notice"><b>hair</b> — mówimy „green hair”, bez „a”.<br><b>eyes</b> — liczba mnoga, np. „two eyes”.<br><b>a nose</b> — jeden nos.</p>';
if(g==='art')x='<p>Wybierz kolor i rysuj palcem lub rysikiem. Oryginalne karty są już w środku. Nie trzeba nic wycinać.</p><p class="notice">Nie ma nagrania robota ani piosenki „Sandman” w załączonym PDF. Dlatego kolorujemy dowolnie i opisujemy własny rysunek. Program nie odgaduje treści brakującego nagrania.</p><p>Na ostatniej karcie możesz narysować siebie, potwora lub inną postać. Powiedz np. „My monster has got two eyes.” Dorosły może pomóc zapisać zdanie. Program zapisuje próbę, nie ocenia pisma.</p>';
if(g==='review')x='<p>Przypomnij sobie powitania i kolorową szkołę z tygodni 1 i 2.</p><div class="grid">'+[['Hello!','Cześć!','👋'],['I’m six.','Mam sześć lat.','🎂'],['I’m happy.','Czuję radość.','😊'],['Nice to meet you.','Miło cię poznać.','🤝'],['The pen is blue.','Długopis jest niebieski.','🖊️'],['pencil case','piórnik','👝'],['ruler','linijka','📏'],['notebook','zeszyt','📓']].map(w=>word(...w)).join('')+'</div><p>W prawdziwej rozmowie podaj własny wiek. Hi też znaczy cześć.</p>';
app.innerHTML=`<div class="tag">POZNAJ • POSŁUCHAJ • POWTÓRZ</div><h1>${G.find(x=>x[0]===g)[2]}</h1>${x}<div class="tools"><button onclick="home()">← Mapa</button><button class="primary" onclick="start('${g}')">Teraz zabawa →</button></div>`;window.scrollTo(0,0)}
function faceSVG(){return `<svg viewBox="0 0 640 420" role="img" aria-label="Twarz z podpisami: hair, forehead, eyes, ears, nose, cheek, mouth, chin" style="width:100%;max-height:500px"><g stroke="#345f62" stroke-width="2"><ellipse cx="320" cy="215" rx="110" ry="145" fill="#f3bc91"/><ellipse cx="205" cy="220" rx="18" ry="32" fill="#f3bc91"/><ellipse cx="435" cy="220" rx="18" ry="32" fill="#f3bc91"/><path d="M211 177 Q190 38 320 60 Q450 38 430 177 Q370 85 320 115 Q265 90 211 177" fill="#784f38"/><ellipse cx="280" cy="205" rx="18" ry="13" fill="white"/><ellipse cx="360" cy="205" rx="18" ry="13" fill="white"/><circle cx="280" cy="205" r="7"/><circle cx="360" cy="205" r="7"/><path d="M320 215 L307 253 L331 253" fill="none"/><path d="M279 281 Q320 321 361 281 Z" fill="white"/><circle cx="263" cy="258" r="17" fill="#e89982" stroke="none"/></g><g stroke="#087c7b" stroke-width="2" fill="none"><path d="M320 75V30H170 M320 151H480 M280 205H145 M445 222H495 M320 244H500 M263 258H140 M320 299H480 M320 350H170"/></g><g font-family="Arial" font-size="23" fill="#173e45"><text x="105" y="36">hair</text><text x="486" y="158">forehead</text><text x="80" y="211">eyes</text><text x="500" y="229">ears</text><text x="505" y="251">nose</text><text x="65" y="265">cheek</text><text x="486" y="306">mouth</text><text x="105" y="358">chin</text></g><\/svg>`}
function start(g){group=g;queue=T.filter(t=>t.g===g&&!state.done.includes(t.id));if(!queue.length)queue=T.filter(t=>t.g===g);at=0;render()}
function render(){answered=false;let t=queue[at];if(!t){app.innerHTML='<div class="task"><div class="icon">⭐</div><h1>Świetna przygoda!</h1><p>Czas na łyk wody i chwilę ruchu.</p><button class="primary" onclick="home()">Wróć na mapę</button></div>';return}app.innerHTML=`<div class="tools"><button onclick="theory('${group}')">📖 Teoria</button><span>Zadanie ${at+1} / ${queue.length}</span></div><progress value="${at}" max="${queue.length}"></progress><div class="task"><h2>${t.q}</h2>${t.draw||t.search?'':`${t.color?`<span class="swatch" style="background:${t.color}"></span>`:''}${t.picture?`<img class="part" src="${A[t.picture]}" alt="Ilustracja części twarzy">`:''}${t.icon?`<div class="icon">${t.icon}</div>`:''}${t.display?`<p class="${t.g==='letters'?'bigword':'en'}">${esc(t.display)}</p>`:''}${t.say?'<button onclick="speak(queue[at].say)">🔊 Posłuchaj</button>':''}<div class="options">${[...t.o].sort((a,b)=>hash(t.id+a)-hash(t.id+b)).map(o=>`<button onclick="answer(this.textContent.trim())">${esc(o)}</button>`).join('')}</div>`}<div id="drawing"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 Podpowiedź</button><button id="next" class="primary" onclick="at++;render()" hidden>Dalej →</button></div></div>`;if(t.draw)draw(t);if(t.search)searchView();window.scrollTo(0,0)}
function hash(s){return [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)}
function answer(v){if(answered)return;let t=queue[at],f=document.getElementById('feedback');if(v===t.a){done(t);f.className='feedback good';f.textContent='Tak! Dobra robota. ⭐'}else{f.className='feedback try';f.textContent='Spróbuj jeszcze raz. Możesz użyć podpowiedzi.'}}
function done(t){answered=true;if(!state.done.includes(t.id))state.done.push(t.id);save();document.getElementById('next').hidden=false}
function hint(){let t=queue[at];if(t.search){searchHint();return;}document.getElementById('feedback').textContent=t.draw?'Rysuj spokojnie. Pokaż pracę dorosłemu; liczy się próba.':'Podpowiedź: '+t.a+(t.g==='letters'?' → '+t.display.replace('_',t.a):'');if(t.say)speak(t.say)}
function draw(t){let d=document.getElementById('drawing');d.innerHTML=`<div class="drawbox"><div class="tools palette">${C.map(c=>`<button style="background:${c[2]}" aria-label="Kolor: ${c[1]}" aria-pressed="${ink===c[2]}" onclick="pick('${c[2]}',this)"></button>`).join('')}</div><canvas id="canvas" width="900" height="1273" aria-label="Karta do kolorowania i pisania"></canvas><div class="tools"><label>Grubość <input type="range" min="2" max="25" value="7" id="width"></label><button onclick="redraw()">Od nowa</button><button onclick="printDrawing()">Drukuj rysunek</button><button class="primary" onclick="finishArt()">Gotowe ✓</button></div></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');marks=0;loadDrawing(state.drawings[t.id]||PAGES[t.page-1]);const point=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!down)return;ctx.strokeStyle=ink;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...point(e));ctx.stroke();marks++};canvas.onpointerup=canvas.onpointercancel=()=>{down=false}}
function pick(c,b){ink=c;document.querySelectorAll('.palette button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}
function loadDrawing(src){let im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function redraw(){if(!confirm('Przywrócić czystą kartę?'))return;marks=0;delete state.drawings[queue[at].id];save();loadDrawing(PAGES[queue[at].page-1])}
function finishArt(){let t=queue[at];if(marks<2&&!state.drawings[t.id]){document.getElementById('feedback').textContent='Najpierw narysuj kilka kresek.';return}state.drawings[t.id]=canvas.toDataURL('image/webp',.8);done(t);document.getElementById('feedback').textContent='Praca zapisana. Pokaż ją dorosłemu. 🎨'}
const PT=["Pisz po śladzie: ludzie i szkoła", "Pisz po śladzie: sala lekcyjna", "Słowniczek: twarz", "Słowniczek: ciało", "Podpisz części twarzy", "Połącz słowa z rysunkami", "Pokoloruj robota", "Wskaż części twarzy", "Kłębki i poduszki", "Kolorowe rozsypanki", "Wyszukiwanka kolorów", "Znajdź inny obrazek", "Piaskowa postać", "Rytmy części twarzy", "Narysuj własną postać"];
function gallery(){app.innerHTML='<h1>Twoje karty z PDF</h1><p>Oryginalne ilustracje i karty do oglądania lub wydruku. Poprawione objaśnienia znajdziesz pod kartą.</p><div class="grid">'+PT.map((p,i)=>`<button class="pagebtn" onclick="sheet(${i+1})">${i+1}. ${p} →</button>`).join('')+'</div>'}
function note(p){return p===4?'Poprawka: feet = stopy, nie „feets”. Hands to dłonie; arms to ręce od barku do nadgarstka.':p===7||p===9||p===13?'W PDF nie ma nagrania. Kartę wykonujemy bez niego: dowolne kolory na postaci, a poduszki według kolorów kłębków.':p===10?'White oznacza biały. Szara plamka przy rozsypance „teiwh” jest błędem ilustracji.':p===11?'Gray = grey. Sekretny kolor to GOLD — złoty. W module dostępna jest klikalna wyszukiwanka.':p===12?'Znajdźcie razem inny kolor lub szczegół. Wskazujcie i mówcie nazwy po angielsku; program nie ocenia tego zadania.':'Oryginalna karta z PDF. Wskazuj, nazywaj i pracuj w swoim tempie.'}
function sheet(p){app.innerHTML=`<button onclick="gallery()">← Karty</button><h2>${p}. ${PT[p-1]}</h2><p class="notice">${note(p)}</p><img class="sheet" src="${PAGES[p-1]}" alt="Oryginalna karta ${p}: ${PT[p-1]}"><button onclick="printPage(${p})">Drukuj tę kartę</button>`;window.scrollTo(0,0)}
function printWin(content){let w=window.open('','_blank');if(!w){alert('Zezwól na otwarcie nowej karty, aby drukować.');return}w.document.write('<!doctype html><html lang="pl"><meta charset="utf-8"><title>Face & Body Club — druk</title><style>body{font:20px Arial;margin:25px}img{max-width:100%;max-height:90vh;object-fit:contain}article{break-after:page}button{font:20px Arial;padding:15px}@media print{button{display:none}img{max-height:250mm}}.part{width:180px;height:140px;object-fit:contain;display:block;margin:10px auto}.wordgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:680px;margin:25px auto}.wordgrid button{font-size:24px;min-height:44px;padding:3px;border-radius:8px;aspect-ratio:1}.wordgrid .found,.wordtag.found{background:#d0eddb;color:#145739}.wordgrid .selected{outline:4px solid #e09d22}.wordtag{display:inline-block;font-size:18px;background:#eef1f1;padding:4px 9px;border-radius:9px;margin:4px}@media(max-width:600px){.wordgrid{gap:2px}.wordgrid button{font-size:16px;min-height:24px;padding:0;border-width:1px}.task:has(.wordgrid){padding:12px}} </style><button onclick="window.print()">Drukuj</button>'+content+'</html>');w.document.close()}
function printPage(p){printWin(`<p>${note(p)}</p><img src="${PAGES[p-1]}">`)}function printDrawing(){printWin('<img src="'+canvas.toDataURL()+'">')}
function printTheory(){printWin('<h1>Face & Body Club • słowniczek</h1>'+[['Twarz',FACE],['Ciało',BODY],['Szkoła',W]].map(([h,ws])=>'<h2>'+h+'</h2>'+ws.map(w=>'<p><b>'+w[0]+'</b> — '+w[1]+'</p>').join('')).join('')+'<p>one foot → two feet • one tooth → teeth</p><p>My monster has got two eyes. — Mój potwór ma dwoje oczu.</p>')}
function adult(){app.innerHTML=`<h1>Dla dorosłych</h1><div class="card"><p>${T.length} aktywności w 10 rozdziałach na podstawie wszystkich 15 stron PDF. Polecenia po polsku, słowa i odczyt po angielsku. Powtórka obejmuje tygodnie 1 i 2.</p><p>Poprawiono „feets” na „feet”. Rozróżniamy hands (dłonie) i arms (kończyny górne). Zapis school-bag ujednolicono jako school bag. Przy „white” pokazujemy biały kolor, choć na oryginalnej karcie jest szara plamka. Grey i gray są poprawne; wyszukiwanka zachowuje źródłowe GRAY. Sekretne słowo GOLD sprawdzono w siatce.</p><p>Nie ma załączonych nagrań ani piosenki „Sandman”. Kolorowanie robota i piaskowej postaci jest swobodne. Poduszki kolorujemy według kłębków. Odczyt słów zapewnia głos przeglądarki — dostępność zależy od urządzenia. Program nie nagrywa ani nie ocenia wymowy.</p><p>Oryginalne karty zachowują wygląd PDF; obok kart dodano uwagi do błędów. Słowniczek korzysta z symboli i schematu twarzy, a rozdział „Widzę i wiem” z wyciętych oryginalnych ilustracji. Wyszukiwanka akceptuje oba kierunki zaznaczania; zapisuje znalezione słowa. Rysunki i postępy pozostają w tej przeglądarce. Pismo, rysunki i zadanie „Znajdź inny obrazek” omawiamy z dorosłym, bez oceny automatycznej.</p><p>Zacznijcie od 3–5 słów i krótkiej przerwy ruchowej. Dziecko może wskazywać części ciała na ilustracji zamiast dotykać siebie. Nie wymaga się opisania całego słownika naraz.</p><h2>Postępy</h2>${G.map(g=>`<p>${g[1]} ${g[2]}: ${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length}</p>`).join('')}<div class="tools"><button onclick="printTheory()">Drukuj słowniczek</button><button onclick="printWin(document.querySelector('.card').innerHTML)">Drukuj postępy</button><button onclick="clearAll()">Wyczyść postępy</button></div></div>`;window.scrollTo(0,0)}
function clearAll(){if(confirm('Usunąć postępy i zapisane rysunki tego modułu?')){state={done:[],drawings:{}};save();home()}}
const GRID=['AYMSCIENREDQ','OEREATOOKNRF','ILSABLACKGYB','NLSWRRMPTPNL','TOTDOEEGJIRU','OWDEWMORANGE','RRHPNUGARKEA','YFAIAGFYUTOP','HMMDTIRRGOLD','PURPLEKEMELH','DVTUADZCEEEY','PSILVERUANST'];
const TARGETS=['RED','YELLOW','WHITE','BLUE','ORANGE','BLACK','PINK','PURPLE','GREEN','GRAY','BROWN','SILVER','GOLD'];let firstCell=null;
function line(a,b){let r0=Math.floor(a/12),c0=a%12,r1=Math.floor(b/12),c1=b%12,dr=r1-r0,dc=c1-c0;if(dr!==0&&dc!==0&&Math.abs(dr)!==Math.abs(dc))return [];let n=Math.max(Math.abs(dr),Math.abs(dc));return Array.from({length:n+1},(_,i)=>(r0+Math.sign(dr)*i)*12+c0+Math.sign(dc)*i)}
function findWord(w){for(let a=0;a<144;a++)for(let b=0;b<144;b++){let p=line(a,b);if(p.map(i=>GRID[Math.floor(i/12)][i%12]).join('')===w)return p}return []}
function searchView(){state.found=state.found||[];firstCell=null;let foundCells=new Set(state.found.flatMap(findWord));document.getElementById('drawing').innerHTML=`<p>Kliknij pierwszą i ostatnią literę słowa.</p><p>${TARGETS.slice(0,12).map(w=>`<span class="wordtag ${state.found.includes(w)?'found':''}">${w}</span>`).join('')}<span class="wordtag ${state.found.includes('GOLD')?'found':''}">SEKRETNY KOLOR ${state.found.includes('GOLD')?'GOLD':'?'}</span></p><div class="wordgrid">${GRID.join('').split('').map((c,i)=>`<button class="${foundCells.has(i)?'found':''}" aria-label="Wiersz ${Math.floor(i/12)+1}, kolumna ${i%12+1}: ${c}" data-cell="${i}" onclick="chooseCell(${i})">${c}</button>`).join('')}</div><p>Znalezione: ${state.found.length} / 13</p>`;if(state.found.length===13){done(queue[at]);document.getElementById('feedback').textContent='Wszystkie kolory znalezione! Sekretny kolor to GOLD — złoty. ⭐'}}
function chooseCell(i){if(answered)return;if(firstCell===null){firstCell=i;document.querySelector(`[data-cell="${i}"]`).classList.add('selected');return}let cells=line(firstCell,i),w=cells.map(j=>GRID[Math.floor(j/12)][j%12]).join('');let reverse=[...w].reverse().join('');let target=TARGETS.includes(w)?w:TARGETS.includes(reverse)?reverse:null;if(target){if(!state.found.includes(target))state.found.push(target);save();searchView();document.getElementById('feedback').textContent=target==='GOLD'?'GOLD — złoty! To sekretny kolor.':'Znalezione: '+target+'!';speak(target.toLowerCase());if(state.found.length===13)document.getElementById('feedback').textContent='Wszystkie kolory znalezione! GOLD — złoty. ⭐'}else{document.querySelectorAll('.selected').forEach(b=>b.classList.remove('selected'));firstCell=null;document.getElementById('feedback').textContent='To jeszcze nie całe słowo. Wybierz pierwszą i ostatnią literę nazwy koloru.'}}
function searchHint(){let w=TARGETS.find(w=>!state.found?.includes(w));if(!w)return;let p=findWord(w),a=p[0],b=p[p.length-1];document.getElementById('feedback').textContent=`Szukaj ${w}: od wiersza ${Math.floor(a/12)+1}, kolumny ${a%12+1} do wiersza ${Math.floor(b/12)+1}, kolumny ${b%12+1}.`;speak(w.toLowerCase())}

home();
</script></html>
