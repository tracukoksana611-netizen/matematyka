function start(g){group=g;queue=T.filter(t=>t.g===g&&!state.done.includes(t.id));if(!queue.length)queue=T.filter(t=>t.g===g);at=0;render()}
function render(){answered=false;let t=queue[at];if(!t){app.innerHTML='<div class="task"><div class="icon">⭐</div><h1>Świetna przygoda!</h1><p>Czas na łyk wody i chwilę ruchu.</p><button class="primary" onclick="home()">Wróć na mapę</button></div>';return}app.innerHTML=`<div class="tools"><button onclick="theory('${group}')">📖 Teoria</button><span>Zadanie ${at+1} / ${queue.length}</span></div><progress value="${at}" max="${queue.length}"></progress><div class="task"><h2>${t.q}</h2>${t.draw?'':`${t.color?`<span class="swatch" style="background:${t.color}"></span>`:''}${t.icon?`<div class="icon">${t.icon}</div>`:''}${t.display?`<p class="${t.g==='letters'?'bigword':'en'}">${esc(t.display)}</p>`:''}${t.say?'<button onclick="speak(queue[at].say)">🔊 Posłuchaj</button>':''}<div class="options">${[...t.o].sort((a,b)=>hash(t.id+a)-hash(t.id+b)).map(o=>`<button onclick="answer(this.textContent.trim())">${esc(o)}</button>`).join('')}</div>`}<div id="drawing"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 Podpowiedź</button><button id="next" class="primary" onclick="at++;render()" hidden>Dalej →</button></div></div>`;if(t.draw)draw(t);window.scrollTo(0,0)}
function hash(s){return [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)}
function answer(v){if(answered)return;let t=queue[at],f=document.getElementById('feedback');if(v===t.a){done(t);f.className='feedback good';f.textContent='Tak! Dobra robota. ⭐'}else{f.className='feedback try';f.textContent='Spróbuj jeszcze raz. Możesz użyć podpowiedzi.'}}
function done(t){answered=true;if(!state.done.includes(t.id))state.done.push(t.id);save();document.getElementById('next').hidden=false}
function hint(){let t=queue[at];document.getElementById('feedback').textContent=t.draw?'Rysuj spokojnie. Pokaż pracę dorosłemu; liczy się próba.':'Podpowiedź: '+t.a+(t.g==='letters'?' → '+t.display.replace('_',t.a):'');if(t.say)speak(t.say)}
function draw(t){let d=document.getElementById('drawing');d.innerHTML=`<div class="drawbox"><div class="tools palette">${C.map(c=>`<button style="background:${c[2]}" aria-label="Kolor: ${c[1]}" aria-pressed="${ink===c[2]}" onclick="pick('${c[2]}',this)"></button>`).join('')}</div><canvas id="canvas" width="900" height="1273" aria-label="Karta do kolorowania i pisania"></canvas><div class="tools"><label>Grubość <input type="range" min="2" max="25" value="7" id="width"></label><button onclick="redraw()">Od nowa</button><button onclick="printDrawing()">Drukuj rysunek</button><button class="primary" onclick="finishArt()">Gotowe ✓</button></div></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');marks=0;loadDrawing(state.drawings[t.id]||PAGES[t.page-1]);const point=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!down)return;ctx.strokeStyle=ink;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...point(e));ctx.stroke();marks++};canvas.onpointerup=canvas.onpointercancel=()=>{down=false}}
function pick(c,b){ink=c;document.querySelectorAll('.palette button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}
function loadDrawing(src){let im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function redraw(){if(!confirm('Przywrócić czystą kartę?'))return;marks=0;delete state.drawings[queue[at].id];save();loadDrawing(PAGES[queue[at].page-1])}
function finishArt(){let t=queue[at];if(marks<2&&!state.drawings[t.id]){document.getElementById('feedback').textContent='Najpierw narysuj kilka kresek.';return}state.drawings[t.id]=canvas.toDataURL('image/webp',.8);done(t);document.getElementById('feedback').textContent='Praca zapisana. Pokaż ją dorosłemu. 🎨'}

function adult(){app.innerHTML=`<h1>Dla dorosłych</h1><div class="card"><p>${T.length} aktywności na podstawie 14 stron PDF: 11 kolorów, 17 przyborów, 8 zdań, 12 luk literowych, 8 zadań z liczbami, 7 prac plastycznych i 8 powtórek tygodnia 1.</p><p>Zacznijcie od 3–5 słów. Cały słownik jest dostępny, ale nie trzeba opanować go w jeden dzień. Praca bez limitu czasu; błędna odpowiedź pozwala spróbować ponownie.</p><p>Poprawki: rubber = gumka, notebook = zeszyt; 5 + 2 = 7. Używamy „pencil case”, „five pairs of scissors” oraz „nine glue sticks”. Oryginalne karty pozostają wierne PDF — uwagi przy nich wyjaśniają błędy. Grey i gray są poprawne. Synonimy eraser, backpack i paper clip są podane w teorii.</p><p>Symbole przy słowach są umowne; karta 11 zawiera oryginalne rysunki. Rozpoznawanie słów sprawdza znaczenie, a nie zdolność nazwania symbolu. Zagadkę różnic oglądacie wspólnie bez automatycznej oceny. Nie ma oryginalnego nagrania — odczyt zapewnia głos urządzenia. Program nie nagrywa dziecka ani nie ocenia wymowy lub pisma.</p><p>Postępy i rysunki są przechowywane w tej przeglądarce. Przeglądarka może ograniczać pamięć lokalną po otwarciu pliku. Przy wyczerpaniu pamięci wydrukuj rysunek.</p><h2>Postępy</h2>${G.map(g=>`<p>${g[1]} ${g[2]}: ${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length}</p>`).join('')}<div class="tools"><button onclick="printTheory()">Drukuj słowniczek</button><button onclick="printWin(document.querySelector('.card').innerHTML)">Drukuj postępy</button><button onclick="clearAll()">Wyczyść postępy</button></div></div>`;window.scrollTo(0,0)}
