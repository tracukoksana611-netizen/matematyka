const LINKS=['elephant','monkey','parrot','crocodile','snake','frog','bat','camel','rhino','rabbit'];let chain=1;
function dominoView(){let next=LINKS[chain%10];document.getElementById('drawing').innerHTML=`<p>Ułożone klocki: ${chain} / 10</p><div class="dominochain">${LINKS.slice(0,chain).map((k,i)=>`<span><img src="${A[k]}" alt="${k}"> | ${LINKS[(i+1)%10]}</span>`).join('')}</div><p>Ostatnie słowo: <b class="en">${next}</b></p><button onclick="speak('${next}')">🔊 Posłuchaj</button><div class="options">${LINKS.filter(k=>!LINKS.slice(0,chain).includes(k)).sort((a,b)=>hash(a)-hash(b)).map(k=>`<button aria-label="Klocek ${k}" onclick="dominoPick('${k}')"><img class="animal" src="${A[k]}" alt="Zwierzę na klocku"></button>`).join('')}</div>`;}
function dominoPick(k){if(answered)return;let expected=LINKS[chain%10];if(k===expected){chain++;if(chain===10){dominoView();done(queue[at]);document.getElementById('feedback').textContent='Całe domino ułożone! Ostatnie słowo elephant wraca do początku. ⭐'}else{dominoView();document.getElementById('feedback').textContent='Pasuje! Szukaj kolejnego zwierzęcia.'}}else document.getElementById('feedback').textContent='Posłuchaj ostatniego słowa i poszukaj innego obrazka.'}
function favouriteView(){document.getElementById('drawing').innerHTML='<div class="options">'+AN.map(a=>`<button onclick="favouritePick('${a[0]}')"><img class="animal" src="${A[a[0]]}" alt="${a[1]}">${a[0]}</button>`).join('')+'</div>'}

function start(g){group=g;queue=T.filter(t=>t.g===g&&!state.done.includes(t.id));if(!queue.length)queue=T.filter(t=>t.g===g);at=0;render()}
function render(){answered=false;chain=1;let t=queue[at];if(!t){app.innerHTML='<div class="task"><div class="icon">⭐</div><h1>Świetna przygoda!</h1><p>Czas na łyk wody i chwilę ruchu.</p><button class="primary" onclick="home()">Wróć na mapę</button></div>';return}app.innerHTML=`<div class="tools"><button onclick="theory('${group}')">📖 Teoria</button><span>Zadanie ${at+1} / ${queue.length}</span></div><progress value="${at}" max="${queue.length}"></progress><div class="task"><h2>${t.q}</h2>${t.draw||t.domino||t.favourite?'':`${t.color?`<span class="swatch" style="background:${t.color}"></span>`:''}${t.picture?`<img class="animal" src="${A[t.picture]}" alt="Ilustracja do ćwiczenia">`:''}${t.row?`<img class="scene" src="${A['row'+t.row]}" alt="Pięć zwierząt, pozycje od lewej 1–5">`:''}${t.icon?`<div class="icon">${t.icon}</div>`:''}${t.display?`<p class="${t.g==='letters'?'bigword':'en'}">${esc(t.display)}</p>`:''}${t.say?'<button onclick="speak(queue[at].say)">🔊 Posłuchaj</button>':''}<div class="options">${[...t.o].sort((a,b)=>hash(t.id+a)-hash(t.id+b)).map(o=>`<button onclick="answer(this.textContent.trim())">${t.pictureOptions?`<img class="animal" src="${A[o]}" alt="Zwierzę">`:t.puzzle?`<img style="height:190px;width:80px" src="${A[o+'right']}" alt="Prawa połówka">`:''}${esc(o)}</button>`).join('')}</div>`}<div id="drawing"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 Podpowiedź</button><button id="next" class="primary" onclick="at++;render()" hidden>Dalej →</button></div></div>`;if(t.draw)draw(t);if(t.domino)dominoView();if(t.favourite)favouriteView();window.scrollTo(0,0)}
function hash(s){return [...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7)}
function answer(v){if(answered)return;let t=queue[at],f=document.getElementById('feedback');if(v===t.a){done(t);f.className='feedback good';f.textContent='Tak! Dobra robota. ⭐';if(t.puzzle)f.innerHTML+=`<div class="halves"><img src="${A[t.a+'left']}" alt="Lewa połówka"><img src="${A[t.a+'right']}" alt="Prawa połówka"></div>`}else{f.className='feedback try';f.textContent='Spróbuj jeszcze raz. Możesz użyć podpowiedzi.'}}
function done(t){answered=true;if(!state.done.includes(t.id))state.done.push(t.id);save();document.getElementById('next').hidden=false}
function hint(){let t=queue[at];if(t.domino){document.getElementById('feedback').textContent='Szukaj: '+LINKS[chain%10];speak(LINKS[chain%10]);return;}if(t.favourite){document.getElementById('feedback').textContent='Wybierz zwierzę, które lubisz. Każdy wybór jest przyjmowany.';return;}document.getElementById('feedback').textContent=t.draw?'Rysuj spokojnie. Pokaż pracę dorosłemu; liczy się próba.':'Podpowiedź: '+t.a+(t.g==='letters'?' → '+t.display.replace('_',t.a):'');if(t.say)speak(t.say)}
function draw(t){let d=document.getElementById('drawing');d.innerHTML=`<div class="drawbox"><div class="tools palette">${C.map(c=>`<button style="background:${c[2]}" aria-label="Kolor: ${c[1]}" aria-pressed="${ink===c[2]}" onclick="pick('${c[2]}',this)"></button>`).join('')}</div><canvas id="canvas" width="900" height="1273" aria-label="Karta do kolorowania i pisania"></canvas><div class="tools"><label>Grubość <input type="range" min="2" max="25" value="7" id="width"></label><button onclick="redraw()">Od nowa</button><button onclick="printDrawing()">Drukuj rysunek</button><button class="primary" onclick="finishArt()">Gotowe ✓</button></div></div>`;canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');marks=0;loadDrawing(state.drawings[t.id]||PAGES[t.page-1]);const point=e=>{let r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]};canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);down=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!down)return;ctx.strokeStyle=ink;ctx.lineWidth=+document.getElementById('width').value;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...point(e));ctx.stroke();marks++};canvas.onpointerup=canvas.onpointercancel=()=>{down=false}}
function pick(c,b){ink=c;document.querySelectorAll('.palette button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}
function loadDrawing(src){let im=new Image();im.onload=()=>{ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=src}
function redraw(){if(!confirm('Przywrócić czystą kartę?'))return;marks=0;delete state.drawings[queue[at].id];save();loadDrawing(PAGES[queue[at].page-1])}
function finishArt(){let t=queue[at];if(marks<2&&!state.drawings[t.id]){document.getElementById('feedback').textContent='Najpierw narysuj kilka kresek.';return}state.drawings[t.id]=canvas.toDataURL('image/webp',.8);done(t);document.getElementById('feedback').textContent='Praca zapisana. Pokaż ją dorosłemu. 🎨'}
const PT=["Animal domino", "Wybierz zwierzę", "Przymiotniki", "Rozmiary zwierząt", "Leśne puzzle — elementy", "Leśne puzzle — ramki", "Moje ulubione zwierzę"];

function adult(){app.innerHTML=`<h1>Dla dorosłych</h1><div class="card"><p>${T.length} aktywności w 9 rozdziałach. Wszystkie 7 stron PDF wbudowano do modułu. Słownik, domino, wybór zwierząt, przymiotniki, rozmiary, cztery leśne puzzle i własne ulubione zwierzę. Powtórka obejmuje tygodnie 1–7.</p><p>Domino wykorzystuje wszystkie dziesięć oryginalnych klocków: słowo prowadzi do obrazka następnego zwierzęcia. Puzzle łączą oryginalne lewe i prawe połówki królika, niedźwiedzia, jeża oraz sowy. Rozmiary porównujemy wyłącznie na rysunkach; pozycje są ponumerowane od lewej.</p><p>W przymiotnikach sprawdzamy znaczenie słów, nie dzielimy gatunków na zawsze bezpieczne i zawsze niebezpieczne. Ujednolicono bear jako niedźwiedź (w źródle „miś”). Favourite to pisownia brytyjska. Uwzględniono a/an: an elephant, an owl.</p><p>Ulubione zwierzę jest wyborem osobistym i każda odpowiedź jest przyjmowana. Rysunek i pismo zapisują udział, bez automatycznej oceny. Pracujcie po kilka słów naraz. Nie ma nagrywania ani oceny wymowy; odczyt zależy od głosu urządzenia.</p><p>Postępy, ostatni wybór ulubionego zwierzęcia i rysunki pozostają w tej przeglądarce. Przy pełnej pamięci wydrukuj rysunek. Oryginalne karty można oglądać i drukować osobno.</p><h2>Postępy</h2>${G.map(g=>`<p>${g[1]} ${g[2]}: ${T.filter(t=>t.g===g[0]&&state.done.includes(t.id)).length} / ${T.filter(t=>t.g===g[0]).length}</p>`).join('')}<div class="tools"><button onclick="printTheory()">Drukuj słowniczek</button><button onclick="printWin(document.querySelector('.card').innerHTML)">Drukuj postępy</button><button onclick="clearAll()">Wyczyść postępy</button></div></div>`;window.scrollTo(0,0)}
